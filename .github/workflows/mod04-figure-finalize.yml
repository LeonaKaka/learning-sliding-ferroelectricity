name: Finalize Module 04 Figure QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mod04-figure-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize lossless Figure crops
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          import re
          import shutil

          pc = Path('assets/pinning-creep')

          # Both source PNGs below were already frozen from the authoritative Drive PDFs
          # at 600 DPI. This one-shot QA pass only removes an accidental caption / partial panel;
          # it does not rescale, JPEG-compress, or fetch any paper online.
          tybell = pc / 'tybell2002-fig3-creep.png'
          with Image.open(tybell) as im:
              if im.size != (2370, 2310):
                  raise SystemExit(f'Unexpected Tybell source dimensions: {im.size}')
              im.crop((150, 0, 2320, 1810)).save(tybell, format='PNG', optimize=False)

          kim = pc / 'kim2014-fig1-pinning.png'
          with Image.open(kim) as im:
              if im.size != (4400, 3460):
                  raise SystemExit(f'Unexpected Kim source dimensions: {im.size}')
              # Keep complete panels (a,b): switched-area plateau + PFM/local-defect sequence.
              # The old asset included only a cut-off fragment of panel (c), so remove it rather
              # than presenting an incomplete scientific panel.
              im.crop((250, 0, 4200, 2665)).save(kim, format='PNG', optimize=False)

          # Make the page caption exactly describe the intentionally retained Kim panels.
          hp = Path('modules/pinning-creep.html')
          text = hp.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(<figure class="fig"><a href="\.\./assets/pinning-creep/kim2014-fig1-pinning\.png".*?<figcaption class="cap">).*?(</figcaption></figure>)',
              re.S,
          )
          replacement = (
              r'\1<b>Fig. 1(a,b) · switched-area plateau 与 PFM pinning image。</b>'
              r'<span class="zoom">点击 Figure 看 600 DPI 原尺寸</span><br>'
              r'(a) 蓝/红箭头分别标出 pinning 与 de-pinning；(b) 把曲线平台对应回真实空间中的 PFM 停滞—再传播序列与 local point defect。'
              r'第二类 pristine-domain-associated pinning 由紧邻的作者原文继续给出，因此这里不保留旧资产中被截断的 panel (c)。\2'
          )
          text2, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'Kim figure caption replacement count was {n}, expected 1')
          hp.write_text(text2, encoding='utf-8')

          # Freeze exact final byte sizes in the static Pages validator.
          pages = Path('.github/workflows/pages.yml')
          w = pages.read_text(encoding='utf-8')
          for name in ('tybell2002-fig3-creep.png', 'kim2014-fig1-pinning.png'):
              size = (pc / name).stat().st_size
              w2, n = re.subn(rf"('{re.escape(name)}':\s*)\d+", rf"\g<1>{size}", w, count=1)
              if n != 1:
                  raise SystemExit(f'Could not update frozen size for {name}')
              w = w2
          pages.write_text(w, encoding='utf-8')

          # Record dimensions, bytes and SHA256 for all final Module 04 figures.
          notes = {
              'tybell2002-fig3-creep.png': 'Tybell 2002 Fig. 3; graph only; printed journal caption removed while all axes, legend and data remain.',
              'paruch2005-fig3-roughness.png': 'Paruch 2005 Fig. 3(a,b); B(L) scaling and roughness-exponent extraction; previously QA-approved crop retained unchanged.',
              'kim2014-fig1-pinning.png': 'Kim 2014 Fig. 1(a,b); plateau plus PFM/local-defect pinning sequence; incomplete fragment of panel (c) intentionally excluded.',
          }
          lines = [
              '# Pinning, Creep & Roughness — frozen lesson assets',
              '',
              'Authoritative sources are the project Google Drive PDFs. Final lesson policy:',
              '',
              '- Source passages are selectable HTML text, not screenshots.',
              '- PDF line wraps/hyphenation may be normalized only to restore reading order; wording is not rewritten inside source blocks.',
              '- Figures are lossless PNG assets derived from the authoritative PDFs at 600 DPI; the deployed Pages workflow never downloads papers or generates/crops figures.',
              '- Final Figure QA checks crop completeness, panel/axis/legend readability, and instructional relevance.',
              '',
              'Frozen figures:',
              '',
          ]
          for name in ('tybell2002-fig3-creep.png', 'paruch2005-fig3-roughness.png', 'kim2014-fig1-pinning.png'):
              p = pc / name
              with Image.open(p) as im:
                  dims = f'{im.width}×{im.height}'
              data = p.read_bytes()
              lines.append(f'- `{name}` — {dims}; {len(data)} bytes; SHA256 `{hashlib.sha256(data).hexdigest()}`. {notes[name]}')
          (pc / 'README.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # Final main must not retain transfer/staging debris or this one-shot workflow.
          shutil.rmtree('staging/module04', ignore_errors=True)
          self_path = Path('.github/workflows/mod04-figure-finalize.yml')
          if self_path.exists():
              self_path.unlink()
          PY

      - name: Commit finalized Module 04 QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Module 04 Figure QA"
          git push
