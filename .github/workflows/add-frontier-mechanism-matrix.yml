name: Add frontier mechanism matrix

on:
  push:
    paths:
      - 'scripts/add_frontier_mechanism_matrix.py'
      - '.github/workflows/add-frontier-mechanism-matrix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply compact mechanism matrix
        run: python scripts/add_frontier_mechanism_matrix.py
      - name: Verify placement and restrained scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('modules/current-frontiers.html')
          t=p.read_text(encoding='utf-8')
          required=[
            'id="mechanism-reconcile"',
            '这些结果真的互相矛盾吗？先把结构条件对齐。',
            '不能推出“任何无预存畴壁的滑移铁电都无法翻转”',
            '不能据此否定多畴样品中的畴壁介导翻转',
            '单一畴壁坐标未必够用',
          ]
          for x in required:
              if x not in t: raise SystemExit(f'missing: {x}')
          if t.count('id="mechanism-reconcile"') != 1:
              raise SystemExit('mechanism matrix duplicated')
          print('compact mechanism matrix placement PASS')
          PY
      - name: Verify Language V2 final seal
        run: python scripts/language_v2_second_pass_fix.py
      - name: Verify Module 08 teaching structure
        run: python scripts/module08_teaching_seal.py
      - name: Verify claim-check contract remains unchanged
        run: python scripts/claim_checks_seal.py
      - name: Verify site teaching seal
        run: python scripts/site_gap_teaching_seal.py
      - name: Diff hygiene
        run: git diff --check
      - name: Commit Module 08 only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/current-frontiers.html
          git commit -m 'Clarify apparently conflicting switching mechanisms'
          git push
