name: Mobile drawer interaction fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/mobile_drawer_interaction_fix.py'
      - '.github/workflows/mobile-drawer-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply safe mobile drawer patch
        run: python scripts/mobile_drawer_interaction_fix.py
      - name: Verify only shared navigation changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]:-<none>}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'site-nav.js'
      - name: Commit mobile drawer interaction fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-nav.js
          git commit -m 'Improve mobile navigation drawer interactions'
          git push
