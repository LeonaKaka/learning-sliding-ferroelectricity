name: Apply roughness acceptance gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-roughness-gate-upgrade.yml'
      - '.github/patches/roughness_gate_20260901.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight
        run: |
          grep -q '三者不一致时' modules/depinning.html
          grep -q '7.3 · finite-size scaling' modules/depinning.html
      - name: Apply idempotent patch
        run: python .github/patches/roughness_gate_20260901.py
      - name: Verify roughness gate
        run: |
          grep -q 'id="roughness-gate"' modules/depinning.html
          grep -q 'super-rough 与 intrinsic anomalous scaling' modules/depinning.html
          grep -q '不要把 mode count 当 n' modules/depinning.html
          grep -q 'R3 · universality cross-check' modules/depinning.html
          python - <<'PY'
          from pathlib import Path
          text=Path('modules/depinning.html').read_text('utf-8')
          bad=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ch not in '\n\r\t']
          assert not bad, bad[:10]
          assert text.count('id="roughness-gate"') == 1
          print('roughness gate HTML integrity passed')
          PY
      - name: Commit lesson
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/depinning.html
          git diff --cached --quiet && exit 0
          git commit -m 'Teach roughness acceptance gate'
          git push origin main
