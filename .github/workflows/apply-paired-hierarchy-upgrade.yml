name: Apply paired-hierarchy statistics upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-paired-hierarchy-upgrade.yml'
      - '.github/patches/paired_hierarchy_20260901.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight
        run: |
          grep -q 'id="data-claim-contract"' modules/research-track.html
          grep -q '<h2>5 · Mechanism falsification' modules/research-track.html
          grep -q 'numerical-modeling.html#run-receipt' modules/research-track.html
      - name: Apply idempotent patch
        run: python .github/patches/paired_hierarchy_20260901.py
      - name: Diagnose and repair equation controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('modules/research-track.html')
          s = p.read_text('utf-8')
          section = s[s.index('id="paired-hierarchy"'):s.index('<h2>5 · Mechanism falsification')]
          print('paired-section control chars before repair:', [(ord(c), repr(c)) for c in section if ord(c) < 32 and c not in '\n\r\t'])
          assert '\x08' in section, 'expected hidden backspace from original \\bar literal'
          s = s.replace('\x08ar{Δ}', 'Δ̄').replace('\x08ar y', 'ȳ')
          s = s.replace(r'\bar{Δ}', 'Δ̄').replace(r'\bar y', 'ȳ')
          p.write_text(s, 'utf-8')
          repaired = p.read_text('utf-8')
          section2 = repaired[repaired.index('id="paired-hierarchy"'):repaired.index('<h2>5 · Mechanism falsification')]
          assert '\x08' not in section2
          assert r'\bar' not in section2
          assert 'Δ̄ = N<sup>−1</sup> Σ' in section2
          assert 'ȳ<sub>i,c</sub> = M<sub>i,c</sub><sup>−1</sup> Σ' in section2
          print('paired-section hidden controls repaired')
          PY
      - name: Verify statistical hierarchy
        run: |
          test "$(grep -o 'id="paired-hierarchy"' modules/research-track.html | wc -l | tr -d ' ')" = "1"
          grep -q 'outer independent unit' modules/research-track.html
          grep -q 'inner stochastic repeat' modules/research-track.html
          grep -q 'common random numbers 是 variance-reduction device' modules/research-track.html
          grep -q 'paired censoring / bound 信息' modules/research-track.html
          grep -q 'finite-size 也有 pairing 陷阱' modules/research-track.html
      - name: Commit paired-hierarchy lesson
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add modules/research-track.html
            git commit -m 'Repair paired-statistics equation controls'
            git push
          fi
