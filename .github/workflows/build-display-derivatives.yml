name: Build lightweight figure display derivatives

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-display-derivatives.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned image encoder
        run: python -m pip install --disable-pip-version-check pillow==12.3.0
      - name: Build display WebP derivatives
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          items=[
            ('assets/switching-pathways/sui2024-fig4-atomic-sliding-pathways.png','assets/switching-pathways/sui2024-fig4-atomic-sliding-pathways-display.webp'),
            ('assets/foundations/yasuda2021-fig1-stacking.png','assets/foundations/yasuda2021-fig1-stacking-display.webp'),
            ('assets/foundations/wu2021-fig1-mechanism.png','assets/foundations/wu2021-fig1-mechanism-display.webp'),
            ('assets/foundations/vizner2021-fig2-domains.png','assets/foundations/vizner2021-fig2-domains-display.webp'),
            ('assets/pinning-creep/kim2014-fig1-pinning.png','assets/pinning-creep/kim2014-fig1-pinning-display.webp'),
            ('assets/foundations/meng2022-fig3e-multistate.png','assets/foundations/meng2022-fig3e-multistate-display.webp'),
          ]
          for src,dst in items:
              with Image.open(src) as raw:
                  im=raw.convert('RGB')
                  if im.width>2200:
                      nh=round(im.height*2200/im.width)
                      im=im.resize((2200,nh),Image.Resampling.LANCZOS)
                  im.save(dst,'WEBP',quality=92,method=6)
                  print(src,'->',dst,im.size)
          PY
      - name: Point display images to derivatives
        run: |
          python - <<'PY'
          from pathlib import Path
          mapping={
            'modules/switching-pathways.html':[
              ('src="../assets/switching-pathways/sui2024-fig4-atomic-sliding-pathways.png"','src="../assets/switching-pathways/sui2024-fig4-atomic-sliding-pathways-display.webp"')],
            'modules/foundations.html':[
              ('src="../assets/foundations/yasuda2021-fig1-stacking.png"','src="../assets/foundations/yasuda2021-fig1-stacking-display.webp"'),
              ('src="../assets/foundations/wu2021-fig1-mechanism.png"','src="../assets/foundations/wu2021-fig1-mechanism-display.webp"'),
              ('src="../assets/foundations/vizner2021-fig2-domains.png"','src="../assets/foundations/vizner2021-fig2-domains-display.webp"'),
              ('src="../assets/foundations/meng2022-fig3e-multistate.png"','src="../assets/foundations/meng2022-fig3e-multistate-display.webp"')],
            'modules/pinning-creep.html':[
              ('src="../assets/pinning-creep/kim2014-fig1-pinning.png"','src="../assets/pinning-creep/kim2014-fig1-pinning-display.webp"')],
          }
          for name,repls in mapping.items():
              p=Path(name); s=p.read_text('utf-8')
              for old,new in repls:
                  assert s.count(old)==1,(name,old,s.count(old))
                  s=s.replace(old,new,1)
              p.write_text(s,'utf-8')
          PY
      - name: Verify derivatives and original links
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          derivs=list(Path('assets').rglob('*-display.webp'))
          assert len(derivs)==6, len(derivs)
          total=0
          for p in derivs:
              with Image.open(p) as im:
                  assert im.width <= 2200 and im.height <= 2200, (p,im.size)
              assert p.stat().st_size < 1024*1024, (p,p.stat().st_size)
              total += p.stat().st_size
          assert total < 2*1024*1024, total
          checks=[
            ('modules/switching-pathways.html','sui2024-fig4-atomic-sliding-pathways.png','sui2024-fig4-atomic-sliding-pathways-display.webp'),
            ('modules/foundations.html','yasuda2021-fig1-stacking.png','yasuda2021-fig1-stacking-display.webp'),
            ('modules/foundations.html','wu2021-fig1-mechanism.png','wu2021-fig1-mechanism-display.webp'),
            ('modules/foundations.html','vizner2021-fig2-domains.png','vizner2021-fig2-domains-display.webp'),
            ('modules/foundations.html','meng2022-fig3e-multistate.png','meng2022-fig3e-multistate-display.webp'),
            ('modules/pinning-creep.html','kim2014-fig1-pinning.png','kim2014-fig1-pinning-display.webp'),
          ]
          for page,orig,disp in checks:
              s=Path(page).read_text('utf-8')
              assert orig in s and disp in s
              assert f'href="../assets/' in s and f'src="../assets/' in s
          print(f'Six display derivatives validated; total={total/1048576:.2f} MiB; original click-through links preserved.')
          PY
      - name: Commit optimized displays
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets modules/foundations.html modules/switching-pathways.html modules/pinning-creep.html
          git diff --cached --quiet && exit 0
          git commit -m 'Serve lightweight display derivatives for largest figures'
          git push origin main
