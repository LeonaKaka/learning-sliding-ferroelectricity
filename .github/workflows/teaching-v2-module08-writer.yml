name: Teaching V2 Module 08 evidence frame

on:
  push:
    paths:
      - 'scripts/teaching_v2_module08_writer.py'
      - '.github/workflows/teaching-v2-module08-writer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Insert Module 08 Teaching V2 layers
        run: python scripts/teaching_v2_module08_writer.py
      - name: Verify only Module 08 changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'modules/current-frontiers.html'
      - name: Commit Module 08 Teaching V2 layers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/current-frontiers.html
          git commit -m 'Add Module 08 Teaching V2 evidence frame'
          git push
