name: Apply parameter-identifiability upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-identifiability-upgrade.yml'
      - '.github/patches/identifiability_20260901.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight
        run: |
          grep -q '<h2>5 · Fedeli 2019' modules/numerical-modeling.html
          grep -q 'id="grid"' modules/numerical-modeling.html
          grep -q 'periodic stacking + diffuse wall + quenched disorder + drive' modules/research-track.html
      - name: Apply idempotent patch
        run: python .github/patches/identifiability_20260901.py
      - name: Verify model calibration contract
        run: |
          test "$(grep -o 'id="identifiability"' modules/numerical-modeling.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="identifiability-bridge"' modules/research-track.html | wc -l | tr -d ' ')" = "1"
          grep -q 'κ/V<sub>0</sub>' modules/numerical-modeling.html
          grep -q 'γ<sub>w</sub> = 8√(κV<sub>0</sub>) / n' modules/numerical-modeling.html
          grep -q 'E P<sub>0</sub> / V<sub>0</sub>' modules/numerical-modeling.html
          grep -q 'calibration closure，不是 independent validation' modules/numerical-modeling.html
          grep -q 'numerical-modeling.html#identifiability' modules/research-track.html
          python - <<'PY'
          from pathlib import Path
          for page in (Path('modules/numerical-modeling.html'), Path('modules/research-track.html')):
              s = page.read_text('utf-8')
              bad = [(i, ord(ch)) for i, ch in enumerate(s) if ord(ch) < 32 and ch not in '\n\r\t']
              assert not bad, (page, bad[:10])
          PY
      - name: Commit identifiability lesson
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add modules/numerical-modeling.html modules/research-track.html
            git commit -m 'Teach model scale and parameter identifiability'
            git push
          fi
