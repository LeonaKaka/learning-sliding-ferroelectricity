name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject terminology runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=[Path('index.html'),*sorted(Path('modules').glob('*.html'))]
          for page in pages:
              text=page.read_text(encoding='utf-8')
              prefix='' if page.name=='index.html' else '../'
              tag=f'<script src="{prefix}terms.js"></script>'
              if '</body>' not in text:
                  raise SystemExit(f'{page}: missing </body>')
              if tag not in text:
                  text=text.replace('</body>',tag+'</body>')
                  page.write_text(text,encoding='utf-8')
          print(f'terminology runtime checked on {len(pages)} pages')
          PY

      - name: Build static search index
        run: python scripts/build_search_index.py

      - name: Validate site structure and navigation runtime
        run: python scripts/site_fragment_seal.py

      - name: Validate static site and Reproduction Lab evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, json, re, struct

          root=Path('.')
          pages=[Path('index.html'),*sorted(Path('modules').glob('*.html'))]
          page_set={p.resolve() for p in pages}

          # All local images and local HTML links must resolve.
          for page in pages:
              text=page.read_text(encoding='utf-8')
              bad=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ch not in '\n\r\t']
              if bad:
                  raise SystemExit(f'{page}: forbidden control characters {bad[:5]}')
              for ref in re.findall(r'<img[^>]+src="([^"]+)"',text):
                  if ref.startswith(('http://','https://','data:')):
                      raise SystemExit(f'{page}: remote image forbidden: {ref}')
                  target=(page.parent/ref).resolve()
                  if not target.exists():
                      raise SystemExit(f'{page}: missing image {ref}')
              for href in re.findall(r'<a[^>]+href="([^"]+)"',text):
                  if href.startswith(('http://','https://','mailto:','#','javascript:')):
                      continue
                  path=href.split('#',1)[0]
                  if not path:
                      continue
                  target=(page.parent/path).resolve()
                  if path.endswith('.html') and not target.exists():
                      raise SystemExit(f'{page}: broken HTML link {href}')

          # Core teaching modules retain their selectable source-text evidence.
          expected_sources={
              'foundations.html':5,'switching-pathways.html':3,'domain-walls.html':4,
              'pinning-creep.html':6,'depinning.html':4,'disorder-rfim.html':3,
              'numerical-modeling.html':3,'current-frontiers.html':5,
          }
          for name,count in expected_sources.items():
              text=(Path('modules')/name).read_text(encoding='utf-8')
              if text.count('class="source-text"')<count:
                  raise SystemExit(f'{name}: missing source-text evidence blocks')

          # Reproduction Lab 01-06 contract is unchanged.
          early={
              'reproduction-lab.html':['lesson01_tdgl_wall.py','lesson01_tdgl_wall_result.svg'],
              'reproduction-lab-02.html':['lesson02_2d_wall_extract.py','lesson02_2d_wall_extract.svg'],
              'reproduction-lab-03.html':['lesson03_ew_roughness.py','lesson03_ew_roughness_thumbnail.svg','caballero2020-fig2-time-roughness.webp'],
              'reproduction-lab-04.html':['lesson04_gl_to_ew.py','lesson04_gl_to_ew_boundary.svg','caballero2020-fig3-temperature-boundary.webp'],
              'reproduction-lab-05.html':['lesson05_rb_projection.py','lesson05_rb_projection_correlator.svg','lesson05_rb_projection_correlator.txt','caballero2020-fig4-pinning-correlator.webp'],
              'reproduction-lab-06.html':['lesson06_disordered_geometry.py','lesson06_disordered_geometry_checkpoint.svg','lesson06_disordered_geometry_checkpoint.txt','caballero2020-fig5-disordered-geometry.webp'],
          }
          for page_name,names in early.items():
              page=Path('modules')/page_name
              text=page.read_text(encoding='utf-8')
              for name in names:
                  candidates=[Path('examples/reproduction-lab')/name,Path('assets/reproduction-lab')/name]
                  p=next((x for x in candidates if x.exists()),None)
                  if p is None or p.stat().st_size==0:
                      raise SystemExit(f'{page_name}: missing {name}')
                  if name.endswith(('.py','.svg','.webp')) and name not in text:
                      raise SystemExit(f'{page_name}: artifact not referenced {name}')

          # L07-12 must render only complete literature figures + code-generated plots.
          evidence={
              'reproduction-lab-07.html':['source-ferrero2013-pre-fig3-full.png','lesson07_bisection.png','lesson07_last_pinned_profile.png','lesson07_particle_gold.png','lesson07_dt_threshold.png'],
              'reproduction-lab-08.html':['source-ferrero2013-review-fig1-full.png','lesson08_vf.png','lesson08_transient_periods.png','lesson08_dt_error.png','lesson08_particle_velocity_gold.png'],
              'reproduction-lab-09.html':['source-ferrero2013-pre-fig5-full.png','lesson09_mean_v_loglog.png','lesson09_beta_vs_window.png','lesson09_threshold_sensitivity.png','lesson09_bootstrap_beta.png'],
              'reproduction-lab-10.html':['lesson10_profiles.png','source-ferrero2013-pre-fig1-full.png','lesson10_Sq.png','lesson10_Br.png','lesson10_zeta_vs_size.png'],
              'reproduction-lab-11.html':['source-ferrero2013-pre-fig2-full.png','lesson11_mean_fc.png','lesson11_std_fc.png','lesson11_nu_vs_window.png','lesson11_collapse_score.png'],
              'reproduction-lab-12.html':['source-ferrero2013-review-fig1-full.png','lesson12_rounding_vT.png','lesson12_psi_vs_window.png','source-ferrero2021-fig3-full.png','lesson12_subthreshold_vT.png','source-ferrero2021-fig4-full.png','lesson12_resolved_fraction.png','lesson12_halfwindow_stability.png'],
          }
          forbidden={
              'lesson07_threshold_search.svg','lesson08_steady_velocity.svg','lesson09_beta_window.svg',
              'lesson10_superrough_zeta.svg','lesson11_fss_nu.svg','lesson12_thermal_rounding.svg',
              'lesson08-bridge-steady-vf.png','lesson09-bridge-beta-window.png',
              'lesson11-bridge-mean-fc.png','lesson11-bridge-std-fc.png',
              'lesson12-bridge-rounding-vT.png','lesson12-bridge-subthreshold-vT.png',
              'ferrero2013-fig1b-velocity-force.svg','ferrero2013-fig4a-critical-structure.svg',
              'ferrero2013-fig4b-finite-size-threshold.svg','ferrero2013-fig5-critical-relaxation.svg',
              'ferrero2013-fig6-thermal-rounding.svg',
          }
          asset=Path('assets/reproduction-lab')
          for page_name,required in evidence.items():
              text=(Path('modules')/page_name).read_text(encoding='utf-8')
              refs={Path(x).name for x in re.findall(r'<img[^>]+src="([^"]+)"',text)}
              missing=set(required)-refs
              if missing:
                  raise SystemExit(f'{page_name}: missing rendered evidence {sorted(missing)}')
              bad=refs&forbidden
              if bad:
                  raise SystemExit(f'{page_name}: forbidden summary/misidentified image rendered {sorted(bad)}')
              for name in required:
                  p=asset/name
                  if not p.exists() or p.stat().st_size==0:
                      raise SystemExit(f'{page_name}: missing evidence file {name}')

          # Complete source figures: canonical PNG, high resolution, provenance receipt.
          complete_sources=[
              'source-ferrero2013-pre-fig1-full.png','source-ferrero2013-pre-fig2-full.png',
              'source-ferrero2013-pre-fig3-full.png','source-ferrero2013-pre-fig5-full.png',
              'source-ferrero2013-review-fig1-full.png','source-ferrero2021-fig3-full.png',
              'source-ferrero2021-fig4-full.png',
          ]
          def png_size(p):
              b=p.read_bytes()
              if b[:8]!=b'\x89PNG\r\n\x1a\n' or b[12:16]!=b'IHDR':
                  raise SystemExit(f'noncanonical PNG: {p}')
              return struct.unpack('>II',b[16:24])
          for name in complete_sources:
              w,h=png_size(asset/name)
              if w<1700 or h<1400:
                  raise SystemExit(f'complete source figure too small: {name} {w}x{h}')
          receipt=json.loads((asset/'source-figure-receipt.json').read_text(encoding='utf-8'))
          if receipt.get('render_dpi',0)<500:
              raise SystemExit('source-figure receipt below 500 dpi')
          rows=receipt.get('figures',[])
          if len(rows)!=7:
              raise SystemExit(f'source-figure receipt expected 7 entries, got {len(rows)}')
          for row in rows:
              for key in ('file','source_page','pixel_size','sha256','citation'):
                  if key not in row:
                      raise SystemExit(f'source receipt missing {key}')
              if row['file'] not in complete_sources:
                  raise SystemExit(f"unexpected source receipt file: {row['file']}")

          # Code-generated plot assets and scripts must exist.
          scripts=[f'lesson{i:02d}_' for i in range(7,13)]
          for prefix in scripts:
              if not any(Path('examples/reproduction-lab').glob(prefix+'*.py')):
                  raise SystemExit(f'missing script prefix {prefix}')
          for page_name,required in evidence.items():
              for name in required:
                  if name.startswith('lesson'):
                      w,h=png_size(asset/name)
                      if w<900 or h<500:
                          raise SystemExit(f'code plot too small: {name} {w}x{h}')

          # Frozen scientific receipts/gates remain unchanged in meaning.
          receipt_markers={
              'lesson07_threshold_search.txt':['THRESHOLD GOLD TEST + SMALL-LINE BRACKET PASS'],
              'lesson08_steady_velocity.txt':['NO BETA FIT IN LESSON 08','STEADY VELOCITY ESTIMATOR + DT CONVERGENCE PASS'],
              'lesson09_beta_window.txt':['UNIVERSAL BETA CLAIM          = NOT AUTHORIZED','WINDOW-STABILITY GATE         = NOT PASSED'],
              'lesson10_superrough_zeta.txt':['SMALL-QEW SUPER-ROUGH SIGNATURE = PASS','THERMODYNAMIC ZETA CLOSURE   = NOT PASSED'],
              'lesson11_fss_nu.txt':['SIZE-WINDOW STABILITY GATE     = NOT PASSED','UNIVERSAL NU CLAIM              = NOT AUTHORIZED'],
              'lesson12_thermal_rounding.txt':['THERMAL-ROUNDING WINDOW GATE    = NOT PASSED','UNIVERSAL PSI CLAIM             = NOT AUTHORIZED','LOW-T CREEP ASYMPTOTIC RESOLVED = NO','CREEP-LAW / MU CLAIM             = NOT AUTHORIZED'],
          }
          for name,markers in receipt_markers.items():
              text=(asset/name).read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f'{name}: missing frozen scientific marker {marker}')

          row_counts={'lesson11_fc_raw.csv':192,'lesson12_rounding_raw.csv':144,'lesson12_subthreshold_raw.csv':40}
          for name,n in row_counts.items():
              rows=sum(1 for _ in (asset/name).open(encoding='utf-8'))-1
              if rows!=n:
                  raise SystemExit(f'{name}: expected {n} rows, got {rows}')

          # Shared Paper2 stylesheet must be used by all six pages.
          css=Path('reproduction-lab-paper2.css')
          if not css.exists() or css.stat().st_size<1000:
              raise SystemExit('missing Paper2 Lab stylesheet')
          for i in range(7,13):
              text=(Path('modules')/f'reproduction-lab-{i:02d}.html').read_text(encoding='utf-8')
              if 'reproduction-lab-paper2.css' not in text:
                  raise SystemExit(f'L{i:02d}: shared stylesheet not linked')

          print('STATIC SITE + LAB07-12 EVIDENCE CONTRACT = PASS')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
