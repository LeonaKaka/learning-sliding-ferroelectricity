name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static lesson assets and evidence policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for page in Path('modules').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              for ref in re.findall(r'<img[^>]+src="([^"]+)"', text):
                  if ref.startswith(('http://','https://','data:')):
                      raise SystemExit(f'{page}: remote image not allowed: {ref}')
                  target = (page.parent / ref).resolve()
                  if not target.exists():
                      raise SystemExit(f'{page}: missing static asset: {ref}')
              print(f'OK local refs: {page}')

          foundations = Path('modules/foundations.html').read_text(encoding='utf-8')
          if 'paragraph-' in foundations or 'paragraph_' in foundations:
              raise SystemExit('Foundations: paragraph screenshots are forbidden')
          if foundations.count('class="source-text"') < 5:
              raise SystemExit('Foundations: expected selectable source-text blocks')
          fdir = Path('assets/foundations')
          if list(fdir.glob('*paragraph*')) or list(fdir.glob('*.webp')):
              raise SystemExit('Foundations: paragraph screenshots/WebP assets are forbidden')

          pathways = Path('modules/switching-pathways.html').read_text(encoding='utf-8')
          if 'paragraph-' in pathways or 'paragraph_' in pathways:
              raise SystemExit('Switching Pathways: paragraph screenshots are forbidden')
          if pathways.count('class="source-text"') < 3:
              raise SystemExit('Switching Pathways: expected selectable source-text blocks')
          expected = {
              'yang2024-fig3-domain-wall-release.png': 779000,
              'sui2024-fig4-atomic-sliding-pathways.png': 6634979,
              'liang2025-fig4-interface-resolved-pathways.png': 592482,
          }
          pdir = Path('assets/switching-pathways')
          for name, size in expected.items():
              p = pdir / name
              if not p.exists(): raise SystemExit(f'Switching Pathways: missing {name}')
              if p.stat().st_size != size:
                  raise SystemExit(f'Switching Pathways: byte-size mismatch for {name}: {p.stat().st_size} != {size}')
          images = {p.name for p in pdir.iterdir() if p.suffix.lower() in {'.png','.jpg','.jpeg','.webp'}}
          if images != set(expected):
              raise SystemExit(f'Switching Pathways: unexpected image set: {sorted(images)}')
          if list(pdir.glob('*paragraph*')) or list(pdir.glob('*.webp')):
              raise SystemExit('Switching Pathways: paragraph screenshots/WebP assets are forbidden')

          pinning = Path('modules/pinning-creep.html').read_text(encoding='utf-8')
          if 'paragraph-' in pinning or 'paragraph_' in pinning:
              raise SystemExit('Pinning/Creep: paragraph screenshots are forbidden')
          if pinning.count('class="source-text"') < 3:
              raise SystemExit('Pinning/Creep: expected three selectable source-text blocks')
          expected_pinning = {
              'tybell2002-fig3-creep.png': 215494,
              'paruch2005-fig3-roughness.png': 85681,
              'kim2014-fig1-pinning.png': 3268576,
          }
          pcdir = Path('assets/pinning-creep')
          for name, size in expected_pinning.items():
              p = pcdir / name
              if not p.exists(): raise SystemExit(f'Pinning/Creep: missing {name}')
              if p.stat().st_size != size:
                  raise SystemExit(f'Pinning/Creep: byte-size mismatch for {name}: {p.stat().st_size} != {size}')
          pc_images = {p.name for p in pcdir.iterdir() if p.suffix.lower() in {'.png','.jpg','.jpeg','.webp'}}
          if pc_images != set(expected_pinning):
              raise SystemExit(f'Pinning/Creep: unexpected image set: {sorted(pc_images)}')
          if list(pcdir.glob('*paragraph*')) or list(pcdir.glob('*.webp')):
              raise SystemExit('Pinning/Creep: paragraph screenshots/WebP assets are forbidden')

          depinning = Path('modules/depinning.html').read_text(encoding='utf-8')
          if 'paragraph-' in depinning or 'paragraph_' in depinning:
              raise SystemExit('Depinning: paragraph screenshots are forbidden')
          if depinning.count('class="source-text"') < 4:
              raise SystemExit('Depinning: expected four selectable source-text blocks')
          expected_depinning = {
              'chauve2000-fig1-force-velocity.png': 80043,
              'rosso2003-fig2-critical-roughness.png': 61989,
              'ferrero2013-fig3-nonsteady-velocity.png': 511879,
              'wiese2022-fig22-depinning-phenomenology.png': 266415,
          }
          ddir = Path('assets/depinning')
          for name, size in expected_depinning.items():
              p = ddir / name
              if not p.exists(): raise SystemExit(f'Depinning: missing {name}')
              if p.stat().st_size != size:
                  raise SystemExit(f'Depinning: byte-size mismatch for {name}: {p.stat().st_size} != {size}')
          d_images = {p.name for p in ddir.iterdir() if p.suffix.lower() in {'.png','.jpg','.jpeg','.webp'}}
          if d_images != set(expected_depinning):
              raise SystemExit(f'Depinning: unexpected image set: {sorted(d_images)}')
          if list(ddir.glob('*paragraph*')) or list(ddir.glob('*.webp')):
              raise SystemExit('Depinning: paragraph screenshots/WebP assets are forbidden')

          print('Static validation complete: source passages are HTML text; frozen lesson assets are local; deployment performs no paper download or crop generation.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
