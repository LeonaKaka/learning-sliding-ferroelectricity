name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify static lesson assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in Path('modules').glob('*.html'):
              text = page.read_text(encoding='utf-8')
              for ref in re.findall(r'<img[^>]+src="([^"]+)"', text):
                  if ref.startswith(('http://','https://','data:')):
                      raise SystemExit(f'{page}: remote image not allowed: {ref}')
                  target = (page.parent / ref).resolve()
                  if not target.exists():
                      raise SystemExit(f'{page}: missing static asset: {ref}')
              print(f'OK {page}')
          print('Static validation complete; no PDF download or crop generation during deploy.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
