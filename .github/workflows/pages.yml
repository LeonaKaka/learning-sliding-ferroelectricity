name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build paper figure crops from source PDFs
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils python3-pil
          mkdir -p assets/domain-walls /tmp/paper-crops

          # Author-hosted copies of the exact published papers.
          # Crop coordinates are frozen only after a 600-DPI whole-page render
          # and visual inspection of the resulting figure boundaries.
          curl -fL --retry 3 -A 'Mozilla/5.0' \
            'https://liutheory.westlake.edu.cn/pdf/Ke25p046201.pdf' \
            -o /tmp/paper-crops/ke2025.pdf
          curl -fL --retry 3 -A 'Mozilla/5.0' \
            'https://liutheory.westlake.edu.cn/pdf/Chen26p011066.pdf' \
            -o /tmp/paper-crops/chen2026.pdf

          pdftoppm -f 2 -l 2 -singlefile -r 600 -png \
            /tmp/paper-crops/ke2025.pdf /tmp/paper-crops/ke-p2
          pdftoppm -f 2 -l 2 -singlefile -r 600 -png \
            /tmp/paper-crops/chen2026.pdf /tmp/paper-crops/chen-p2
          pdftoppm -f 3 -l 3 -singlefile -r 600 -png \
            /tmp/paper-crops/chen2026.pdf /tmp/paper-crops/chen-p3

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          out = Path('assets/domain-walls')
          specs = [
              # Ke 2025 Fig. 1: AB/BA structures + displacement-space force map
              ('/tmp/paper-crops/ke-p2.png', (400, 385, 2500, 1725), 'ke2025-fig1-bec-force.webp'),
              # Chen 2026 full Fig. 1
              ('/tmp/paper-crops/chen-p2.png', (440, 360, 4680, 3710), 'chen2026-fig1.webp'),
              # Chen 2026 full Fig. 2: bubble/rough-edge pinning panels (a-f)
              ('/tmp/paper-crops/chen-p3.png', (2600, 3150, 4670, 4885), 'chen2026-fig2-pinning.webp'),
          ]
          for src, box, name in specs:
              im = Image.open(src).convert('RGB').crop(box)
              maxw = 1900
              if im.width > maxw:
                  im = im.resize((maxw, round(im.height * maxw / im.width)), Image.Resampling.LANCZOS)
              im.save(out / name, 'WEBP', quality=88, method=6)
              print(name, im.size)

          # Insert the verified Ke figure directly beside the paragraph that
          # explains the BEC/C3 argument. This modifies only the deploy artifact.
          page = Path('modules/domain-walls.html')
          html = page.read_text(encoding='utf-8')
          needle = '  <div class="equation">F<sub>IP</sub>'
          figure = '''  <figure class="figure">\n    <img src="../assets/domain-walls/ke2025-fig1-bec-force.webp" alt="Ke et al. 2025 Fig. 1 showing AB and BA stacking and the in-plane force map" />\n    <figcaption>Ke, Liu &amp; Liu, <i>Phys. Rev. Lett.</i> 135, 046201 (2025), Fig. 1. 原始 PDF 第 2 页先以 600 DPI 渲染，再裁到完整 (a)–(d) 组图；保留结构示意、位移坐标、力矢量和 color bar，去掉页眉、caption 与邻近正文。</figcaption>\n  </figure>\n  <p class="figure-note">这张图和上面的原文是同一件事：先看 (a)(b) 的 AB/BA，再看 (d) 三个极化稳定点附近的力场。稳定点处净面内驱动力消失，偏离高对称 stacking 后才出现非零矢量。</p>\n\n'''
          if needle not in html:
              raise SystemExit('Ke figure insertion point not found')
          html = html.replace(needle, figure + needle, 1)
          page.write_text(html, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
