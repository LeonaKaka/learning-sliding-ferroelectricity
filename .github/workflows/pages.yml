name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject bilingual terminology runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = [Path('index.html'), *sorted(Path('modules').glob('*.html'))]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              prefix = '' if page.name == 'index.html' else '../'
              tag = f'<script src="{prefix}terms.js"></script>'
              if '</body>' not in text:
                  raise SystemExit(f'{page}: missing </body>')
              if tag not in text:
                  text = text.replace('</body>', tag + '</body>')
              page.write_text(text, encoding='utf-8')
          print(f'Injected single bilingual runtime into {len(pages)} pages.')
          PY

      - name: Verify static evidence site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          all_pages = [Path('index.html'), *sorted(Path('modules').glob('*.html'))]
          for page in all_pages:
              text = page.read_text(encoding='utf-8')
              bad = [(i, ord(ch)) for i, ch in enumerate(text) if ord(ch) < 32 and ch not in '\n\r\t']
              if bad:
                  raise SystemExit(f'{page}: forbidden control characters found: {bad[:10]}')

          expected_sources = {
              'foundations.html': 5, 'switching-pathways.html': 3,
              'domain-walls.html': 4, 'pinning-creep.html': 6,
              'depinning.html': 4, 'disorder-rfim.html': 3,
              'numerical-modeling.html': 3, 'current-frontiers.html': 5,
          }
          for name, count in expected_sources.items():
              page = Path('modules') / name
              text = page.read_text(encoding='utf-8')
              if text.count('class="source-text"') < count:
                  raise SystemExit(f'{name}: missing selectable source-text blocks')
              if 'paragraph-' in text or 'paragraph_' in text:
                  raise SystemExit(f'{name}: paragraph screenshots are forbidden')
              tag = '<script src="../terms.js"></script>'
              if tag not in text:
                  raise SystemExit(f'{name}: terminology runtime missing')
              if 'terms-extra.js' in text or 'terms-cleanup.js' in text:
                  raise SystemExit(f'{name}: legacy overlapping terminology runtime injected')
              for ref in re.findall(r'<img[^>]+src="([^"]+)"', text):
                  if ref.startswith(('http://','https://','data:')):
                      raise SystemExit(f'{name}: remote image not allowed: {ref}')
                  if not (page.parent / ref).resolve().exists():
                      raise SystemExit(f'{name}: missing image: {ref}')

          index = Path('index.html').read_text(encoding='utf-8')
          if '<script src="terms.js"></script>' not in index:
              raise SystemExit('index.html: terminology runtime missing')
          if 'terms-extra.js' in index or 'terms-cleanup.js' in index:
              raise SystemExit('index.html: legacy overlapping terminology runtime injected')

          terms = Path('terms.js').read_text(encoding='utf-8')
          required_terms = (
              "['domain wall','畴壁']", "['pinning','钉扎']", "['creep','蠕变']",
              "['depinning','退钉扎']", "['finite-size scaling','有限尺寸标度']",
              "['random-field','随机场']", "['random-bond','随机键']",
              "['RFIM','随机场伊辛模型']", "['QEW','淬火 Edwards–Wilkinson 模型']",
              "['phase-field','相场']", "['TDGL','含时金兹堡–朗道方程']",
              "['order parameter','序参量']", "['structure factor','结构因子']",
              "['universality','普适性']", "['stacking registry','堆垛构型']",
              "['switching pathway','极化翻转路径']", "['Born effective charge','Born 有效电荷']",
              "['KPFM','开尔文探针力显微镜']",
              "el.closest('script,style,pre,code,kbd,samp,math,.source-text,.eq,h1,h2,h3,a,.brand,.bar')",
              "addMobileToc()",
          )
          for marker in required_terms:
              if marker not in terms:
                  raise SystemExit(f'terms.js: missing terminology/behavior marker: {marker}')

          frozen = {
              'assets/interface-scaling/zhou2012-fig2-anomalous-roughness.png': (7818, 'd59962ea8bae39ee79afc89969daf071d1cef4721e89958e52ed5df786b13450'),
              'assets/interface-scaling/caballero2020-fig1-bulk-to-interface.png': (13797, '8a4493aac052dccb9752a23e7998a23db17947e561bd81cdc60413bb60a10dcc'),
              'assets/interface-scaling/caballero2020-fig5-roughness.png': (13214, 'a0ec188345c910ecbdb3e49ea63c1c1aa4eac5bf1a1af4cc978d5df7acc78383'),
              'assets/interface-scaling/caballero2020-fig5-structure-factor.png': (14359, '53b6dedc4183599b445ee30443744f5622702e54a8b542ccc87fe774e515be31'),
          }
          for path, (size, digest) in frozen.items():
              p = Path(path)
              if not p.exists() or p.stat().st_size != size:
                  raise SystemExit(f'bad frozen asset: {path}')
              if hashlib.sha256(p.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'hash mismatch: {path}')

          if Path('assets/repaired-0607').exists():
              raise SystemExit('temporary repaired-0607 asset directory must not return')
          if Path('scripts').exists():
              raise SystemExit('legacy evidence-regeneration scripts must not remain in static V1')
          for legacy_runtime in ('terms-extra.js', 'terms-cleanup.js'):
              if Path(legacy_runtime).exists():
                  raise SystemExit(f'unused legacy terminology runtime must be removed: {legacy_runtime}')
          if Path('_bilingual_noop.txt').exists():
              raise SystemExit('temporary bilingual staging marker must not remain')

          unique_contracts = {
              Path('index.html'): ('id="foundations"',),
              Path('modules/research-track.html'): (
                  'id="fair"', 'id="identifiability-bridge"', 'id="data-claim-contract"',
                  'id="event-contract"', 'id="paired-hierarchy"', 'id="collapse-gate-bridge"',
                  'id="roughness-gate-bridge"'
              ),
              Path('modules/pinning-creep.html'): ('id="roughness-gate"',),
              Path('modules/numerical-modeling.html'): (
                  'id="identifiability"', 'id="thermal-noise"', 'id="velocity-estimator"',
                  'id="threshold-authority-bridge"', 'id="run-receipt"'
              ),
              Path('modules/depinning.html'): (
                  'id="data-claim-bridge"', 'id="collapse-gate"', 'id="threshold-ladder"'
              ),
          }
          for page, markers in unique_contracts.items():
              text = page.read_text(encoding='utf-8')
              for marker in markers:
                  if text.count(marker) != 1:
                      raise SystemExit(f'{page}: expected exactly one unique contract marker: {marker}')

          required_links = {
              Path('modules/numerical-modeling.html'): (
                  'href="#identifiability"', 'href="#thermal-noise"', 'depinning.html#threshold-ladder',
                  'research-track.html#fair'
              ),
              Path('modules/depinning.html'): ('href="#threshold-ladder"',),
              Path('modules/research-track.html'): (
                  'numerical-modeling.html#identifiability', 'numerical-modeling.html#thermal-noise',
                  'depinning.html#collapse-gate', 'pinning-creep.html#roughness-gate'
              ),
              Path('modules/foundations.html'): ('../index.html#foundations',),
          }
          for page, markers in required_links.items():
              text = page.read_text(encoding='utf-8')
              for marker in markers:
                  if marker not in text:
                      raise SystemExit(f'{page}: missing required cross-link: {marker}')
          print('Static evidence + conservative terminology validation passed.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
