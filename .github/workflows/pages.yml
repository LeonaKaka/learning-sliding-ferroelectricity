name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject bilingual terminology runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          pages = [Path('index.html'), *sorted(Path('modules').glob('*.html'))]
          for page in pages:
              text = page.read_text(encoding='utf-8')
              prefix = '' if page.name == 'index.html' else '../'
              tags = [
                  f'<script src="{prefix}terms-extra.js"></script>',
                  f'<script src="{prefix}terms.js"></script>',
              ]
              if '</body>' not in text:
                  raise SystemExit(f'{page}: missing </body>')
              for tag in reversed(tags):
                  if tag not in text:
                      text = text.replace('</body>', tag + '</body>')
              page.write_text(text, encoding='utf-8')
          print(f'Injected bilingual runtimes into {len(pages)} pages.')
          PY

      - name: Verify static evidence site
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re

          expected_sources = {
              'foundations.html': 5, 'switching-pathways.html': 3,
              'domain-walls.html': 4, 'pinning-creep.html': 6,
              'depinning.html': 4, 'disorder-rfim.html': 3,
              'numerical-modeling.html': 3, 'current-frontiers.html': 5,
          }
          for name, count in expected_sources.items():
              page = Path('modules') / name
              text = page.read_text(encoding='utf-8')
              if text.count('class="source-text"') < count:
                  raise SystemExit(f'{name}: missing selectable source-text blocks')
              if 'paragraph-' in text or 'paragraph_' in text:
                  raise SystemExit(f'{name}: paragraph screenshots are forbidden')
              e = text.find('<script src="../terms-extra.js"></script>')
              m = text.find('<script src="../terms.js"></script>')
              if e < 0 or m < 0 or e > m:
                  raise SystemExit(f'{name}: bilingual runtimes missing or wrong order')
              for ref in re.findall(r'<img[^>]+src="([^"]+)"', text):
                  if ref.startswith(('http://','https://','data:')):
                      raise SystemExit(f'{name}: remote image not allowed: {ref}')
                  if not (page.parent / ref).resolve().exists():
                      raise SystemExit(f'{name}: missing image: {ref}')

          index = Path('index.html').read_text(encoding='utf-8')
          e = index.find('<script src="terms-extra.js"></script>')
          m = index.find('<script src="terms.js"></script>')
          if e < 0 or m < 0 or e > m:
              raise SystemExit('index.html: bilingual runtimes missing or wrong order')

          terms = Path('terms.js').read_text(encoding='utf-8')
          required_terms = (
              "['domain wall','畴壁']", "['pinning','钉扎']", "['creep','蠕变']",
              "['depinning','退钉扎']", "['finite-size scaling','有限尺寸标度']",
              "['random-field','随机场']", "['random-bond','随机键']",
              "['RFIM','随机场伊辛模型']", "['QEW','淬火 Edwards–Wilkinson 模型']",
              "['phase-field','相场']", "['TDGL','含时金兹堡–朗道方程']",
              "['order parameter','序参量']", "['structure factor','结构因子']",
              "['universality','普适性']", "['stacking registry','堆垛构型']",
              "['switching pathway','极化翻转路径']", "['Born effective charge','Born 有效电荷']",
              "['KPFM','开尔文探针力显微镜']",
              "el.closest('script,style,pre,code,.source-text')",
              "'foundations.html':'switching-pathways.html'",
              "'depinning.html':'disorder-rfim.html'",
              "'disorder-rfim.html':'numerical-modeling.html'",
              "'numerical-modeling.html':'current-frontiers.html'",
          )
          for marker in required_terms:
              if marker not in terms:
                  raise SystemExit(f'terms.js: missing terminology/behavior marker: {marker}')

          extra = Path('terms-extra.js').read_text(encoding='utf-8')
          for marker in (
              "['Monte Carlo','蒙特卡洛']", "['self-similar','自相似']",
              "['soliton profile','孤子剖面']", "['Stark shift','斯塔克位移']",
              "['pulse width','脉冲宽度']", "['inset','插图']",
              "['degree of freedom','自由度']", "['Peierls potential','佩尔斯势']",
              "el.closest('script,style,pre,code,.source-text')",
          ):
              if marker not in extra:
                  raise SystemExit(f'terms-extra.js: missing audit marker: {marker}')

          frozen = {
              'assets/repaired-0607/zhou2012-fig2-anomalous-roughness.png': (7818, 'd59962ea8bae39ee79afc89969daf071d1cef4721e89958e52ed5df786b13450'),
              'assets/repaired-0607/caballero2020-fig1-bulk-to-interface.png': (13797, '8a4493aac052dccb9752a23e7998a23db17947e561bd81cdc60413bb60a10dcc'),
              'assets/repaired-0607/caballero2020-fig5-roughness.png': (13214, 'a0ec188345c910ecbdb3e49ea63c1c1aa4eac5bf1a1af4cc978d5df7acc78383'),
              'assets/repaired-0607/caballero2020-fig5-structure-factor.png': (14359, '53b6dedc4183599b445ee30443744f5622702e54a8b542ccc87fe774e515be31'),
          }
          for path, (size, digest) in frozen.items():
              p = Path(path)
              if not p.exists() or p.stat().st_size != size:
                  raise SystemExit(f'bad repaired asset: {path}')
              if hashlib.sha256(p.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f'hash mismatch: {path}')

          if Path('scripts').exists():
              raise SystemExit('legacy evidence-regeneration scripts must not remain in static V1')
          if Path('_bilingual_noop.txt').exists():
              raise SystemExit('temporary bilingual staging marker must not remain')
          print('Static evidence + bilingual terminology validation passed.')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
