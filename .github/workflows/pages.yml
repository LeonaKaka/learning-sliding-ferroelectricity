name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Foundations paper screenshots
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --quiet pymupdf pillow
          mkdir -p assets/foundations /tmp/foundations

          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://par.nsf.gov/servlets/purl/10326015' -o /tmp/foundations/wu2021.pdf
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://arxiv.org/pdf/2010.06600' -o /tmp/foundations/yasuda2021.pdf
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://arxiv.org/pdf/2010.05182' -o /tmp/foundations/vizner2021.pdf
          curl -fL --retry 3 -A 'Mozilla/5.0' 'https://arxiv.org/pdf/2211.05277' -o /tmp/foundations/meng2022.pdf

          for f in /tmp/foundations/*.pdf; do
            head -c 4 "$f" | grep -q '%PDF' || { echo "Not a PDF: $f"; exit 1; }
          done
          sed -i 's/Fig\. 1\. Mechanism of sliding ferroelectricity/Mechanism of sliding ferroelectricity/' scripts/build_foundations.py
          python3 scripts/build_foundations.py

      - name: Build verified Domain Walls screenshots
        shell: bash
        run: bash scripts/build_domain_walls.sh

      - name: Verify lesson image references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          pages = [Path('modules/foundations.html'), Path('modules/domain-walls.html')]
          for page in pages:
              refs = re.findall(r'<img[^>]+src="([^"]+)"', page.read_text(encoding='utf-8'))
              missing = [ref for ref in refs if not (page.parent/ref).resolve().exists()]
              if missing:
                  raise SystemExit(f'{page}: missing image refs: {missing}')
              print(page, f'{len(refs)}/{len(refs)} images resolved')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
