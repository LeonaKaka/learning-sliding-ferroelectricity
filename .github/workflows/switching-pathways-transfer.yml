name: Transfer Switching Pathways lossless assets

on:
  push:
    branches: [switching-pathways-hq]

permissions:
  contents: write

jobs:
  transfer:
    if: github.event.head_commit.message != 'Add lossless Switching Pathways figures'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact lossless figures and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/switching-pathways
          curl -L --fail --retry 3 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-b418-81fd-a64e-7ac7c5c68ae7/raw?se=2026-08-31T05%3A22%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=227edc9c-75f0-42d5-86ca-cec973744740&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T18%3A53%3A23Z&ske=2026-08-31T18%3A53%3A23Z&sks=b&skv=2026-02-06&sig=MCL4oYSUN43kXFdGzdIyIvsuEqtgdk1Pk68olMgXHWU%3D' -o assets/switching-pathways/yang2024-fig3-domain-wall-release.png
          curl -L --fail --retry 3 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-0510-81fd-8c81-7565537907ed/raw?se=2026-08-31T05%3A22%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=227edc9c-75f0-42d5-86ca-cec973744740&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T01%3A33%3A31Z&ske=2026-09-01T01%3A33%3A31Z&sks=b&skv=2026-02-06&sig=QBvmnSsUFPRbk7xASHuvHu7Hfqf1PC/NfpvJUQY/8yM%3D' -o assets/switching-pathways/sui2024-fig4-atomic-sliding-pathways.png
          curl -L --fail --retry 3 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-7254-81fd-8cc2-24c8da640792/raw?se=2026-08-31T05%3A22%3A02Z&sp=r&sv=2026-02-06&sr=b&scid=227edc9c-75f0-42d5-86ca-cec973744740&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-31T01%3A33%3A31Z&ske=2026-09-01T01%3A33%3A31Z&sks=b&skv=2026-02-06&sig=hMLjlBTo9h59ix45ZAMlrYPoAFGA3F1UYHGiaj5onQ0%3D' -o assets/switching-pathways/liang2025-fig4-interface-resolved-pathways.png
          cat > /tmp/sha256.txt <<'EOF'
          8487ba0e935860e8cf42f17b9ce80b10d6d153efb953952538d81e4aa6fcbfbe  assets/switching-pathways/yang2024-fig3-domain-wall-release.png
          4586bc737dba5e9231a593f2fa11b0d9638d2ca864fb81405aec72df9042635e  assets/switching-pathways/sui2024-fig4-atomic-sliding-pathways.png
          a395798be31bcea4799fb16efa0d91a6a9426d55bd549d737bd9e6d6257045c2  assets/switching-pathways/liang2025-fig4-interface-resolved-pathways.png
          EOF
          sed -i 's/^          //' /tmp/sha256.txt
          sha256sum -c /tmp/sha256.txt
          test "$(stat -c%s assets/switching-pathways/yang2024-fig3-domain-wall-release.png)" = 779000
          test "$(stat -c%s assets/switching-pathways/sui2024-fig4-atomic-sliding-pathways.png)" = 6634979
          test "$(stat -c%s assets/switching-pathways/liang2025-fig4-interface-resolved-pathways.png)" = 592482
      - name: Commit exact assets to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/switching-pathways/*.png
          git commit -m 'Add lossless Switching Pathways figures'
          git push origin HEAD:switching-pathways-hq
