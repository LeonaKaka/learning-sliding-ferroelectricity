name: Apply Science V3

on:
  push:
    paths:
      - 'scripts/science_v3_apply.py'
      - 'scripts/claim_checks_seal.py'
      - '.github/workflows/science-v3-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Apply Science V3 content upgrade
        run: python scripts/science_v3_apply.py
      - name: Keep workflow changes out of the bot commit
        run: |
          rm .github/workflows/science-v3-seal.yml
          python - <<'PY'
          from pathlib import Path

          frontier = Path('modules/current-frontiers.html')
          text = frontier.read_text(encoding='utf-8')
          text = text.replace(
              'h<sub>eff</sub>(r,φ,E,t,history)，此时固定的 h(r) 只能作为受控近似。',
              'h<sub>eff</sub>(r,φ,E,t,𝓗)，其中 𝓗 表示驱动历史；此时固定的 h(r) 只能作为受控近似。',
          )
          frontier.write_text(text, encoding='utf-8')

          claim = Path('scripts/claim_checks_seal.py')
          text = claim.read_text(encoding='utf-8')
          text = text.replace(
              'modules 01-08 keep 3/3/3/3/4/4/4/4 folded evidence-to-claim judgments (32 total)',
              'modules 01-08 keep 3/3/3/3/5/5/5/5 folded evidence-to-claim judgments (32 total)',
          )
          claim.write_text(text, encoding='utf-8')
          PY
      - name: Verify Science V3 seal
        run: python scripts/science_v3_seal.py
      - name: Verify Language V2 final read-only seal
        run: python scripts/language_v2_second_pass_fix.py
      - name: Verify Teaching V2 site-gap seal
        run: python scripts/site_gap_teaching_seal.py
      - name: Verify Concept Paths seal
        run: python scripts/concept_paths_seal.py
      - name: Verify claim-check seal
        run: python scripts/claim_checks_seal.py
      - name: Verify Module 07 teaching seal
        run: python scripts/module07_teaching_seal.py
      - name: Verify Module 08 teaching seal
        run: python scripts/module08_teaching_seal.py
      - name: Diff hygiene
        run: |
          git diff --check
          git status --short
      - name: Commit Science V3 content and read-only scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules scripts/claim_checks_seal.py scripts/science_v3_seal.py scripts/science_v3_source_text_receipt.json
          git commit -m 'Strengthen scientific model boundaries'
          git push
