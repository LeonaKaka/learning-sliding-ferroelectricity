name: Apply Science V3

on:
  push:
    paths:
      - 'scripts/science_v3_apply.py'
      - '.github/workflows/science-v3-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Apply Science V3 content upgrade
        run: python scripts/science_v3_apply.py
      - name: Verify Science V3 seal
        run: python scripts/science_v3_seal.py
      - name: Verify Language V2 read-only seal
        run: python scripts/language_v2_second_pass.py
      - name: Verify Teaching V2 site-gap seal
        run: python scripts/site_gap_teaching_seal.py
      - name: Verify Concept Paths seal
        run: python scripts/concept_paths_seal.py
      - name: Verify claim-check seal
        run: python scripts/claim_checks_seal.py
      - name: Verify Module 07 teaching seal
        run: python scripts/module07_teaching_seal.py
      - name: Verify Module 08 teaching seal
        run: python scripts/module08_teaching_seal.py
      - name: Remove one-shot writer
        run: rm scripts/science_v3_apply.py .github/workflows/science-v3-apply.yml
      - name: Diff hygiene
        run: |
          git diff --check
          git status --short
      - name: Commit Science V3 source and persistent seals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Strengthen scientific model boundaries'
          git push
