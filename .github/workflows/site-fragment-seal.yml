name: Site fragment seal

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'modules/*.html'
      - 'scripts/site_fragment_seal.py'
      - '.github/workflows/site-fragment-seal.yml'

permissions:
  contents: read

jobs:
  fragments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local HTML files and fragments
        run: python scripts/site_fragment_seal.py
