name: Build Reproduction Lab Lesson 02 result

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-lesson02-result.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Normalize Lesson 02 output to SVG
        run: |
          python - <<'PY'
          from pathlib import Path
          sp=Path('examples/reproduction-lab/lesson02_2d_wall_extract.py')
          s=sp.read_text('utf-8').replace('lesson02_2d_wall_extract.png','lesson02_2d_wall_extract.svg')
          sp.write_text(s,'utf-8')
          hp=Path('modules/reproduction-lab-02.html')
          h=hp.read_text('utf-8').replace('lesson02_2d_wall_extract.png','lesson02_2d_wall_extract.svg')
          hp.write_text(h,'utf-8')
          Path('assets/reproduction-lab/lesson02_2d_wall_extract.png').unlink(missing_ok=True)
          Path('assets/reproduction-lab/lesson02_2d_wall_extract.png.b64.tmp').unlink(missing_ok=True)
          PY
      - name: Run repository Lesson 02 gold test
        run: python examples/reproduction-lab/lesson02_2d_wall_extract.py | tee /tmp/lesson02.log
      - name: Verify generated result and hard gates
        run: |
          grep -q 'ALL HARD GATES PASS' /tmp/lesson02.log
          grep -q 'final wall RMS    = 2.628690e-03' /tmp/lesson02.log
          grep -q 'max B(r)          = 2.764004e-05' /tmp/lesson02.log
          grep -q 'profile RMSE      = 4.019818e-04' /tmp/lesson02.log
          test -s assets/reproduction-lab/lesson02_2d_wall_extract.svg
          grep -q 'lesson02_2d_wall_extract.svg' modules/reproduction-lab-02.html
          ! test -e assets/reproduction-lab/lesson02_2d_wall_extract.png
          ! test -e assets/reproduction-lab/lesson02_2d_wall_extract.png.b64.tmp
      - name: Commit generated Lesson 02 evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/reproduction-lab-02.html examples/reproduction-lab/lesson02_2d_wall_extract.py assets/reproduction-lab/
          git commit -m 'Generate Lesson 02 wall-extraction evidence from repository script'
          git push
