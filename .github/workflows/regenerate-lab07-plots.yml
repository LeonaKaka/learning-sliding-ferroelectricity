name: Regenerate Lab 07 plots

on:
  push:
    paths:
      - '.github/workflows/regenerate-lab07-plots.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CJK font and scientific Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Regenerate and verify Lab 07 scientific evidence
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          python examples/reproduction-lab/lesson07_threshold_search.py | tee /tmp/lab07.out
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image

          out = Path('/tmp/lab07.out').read_text(encoding='utf-8')
          receipt_path = Path('assets/reproduction-lab/lesson07_threshold_search.txt')
          receipt = receipt_path.read_text(encoding='utf-8')

          marker = 'THRESHOLD GOLD TEST + SMALL-LINE BRACKET PASS'
          if marker not in out or marker not in receipt:
              raise SystemExit('Lab 07 PASS marker missing')
          if 'particle exact fc           = 1.000000000' not in receipt:
              raise SystemExit('analytic particle threshold marker missing')

          particle = re.findall(r'particle dt=(0\.040|0\.020|0\.010) bracket\s+= \[([0-9.]+), ([0-9.]+)\]', receipt)
          if len(particle) != 3:
              raise SystemExit(f'expected 3 particle brackets, found {len(particle)}')
          for dt, slo, shi in particle:
              lo, hi = float(slo), float(shi)
              if not (lo < 1.0 < hi):
                  raise SystemExit(f'particle dt={dt} bracket does not cover exact fc=1: [{lo}, {hi}]')
              if hi - lo >= 5e-5:
                  raise SystemExit(f'particle dt={dt} bracket too wide: {hi-lo}')

          m = re.search(r'particle max \|fc-1\|\s+= ([0-9.eE+-]+)', receipt)
          if not m or float(m.group(1)) >= 5e-5:
              raise SystemExit('particle gold-test error gate failed')

          exact_line = (
              'line dt=0.100 bracket       = [0.777636719, 0.777783203]',
              'line dt=0.050 bracket       = [0.777636719, 0.777783203]',
              'line dt=0.025 bracket       = [0.777636719, 0.777783203]',
              'line fc midpoint (dt=.05)   = 0.777709961',
              'line dt-spread              = 0.000e+00',
              'line final bracket width    = 1.465e-04',
          )
          for token in exact_line:
              if token not in receipt:
                  raise SystemExit(f'QEW threshold result drifted: {token}')

          pngs = (
              'lesson07_last_pinned_profile.png',
              'lesson07_bisection.png',
              'lesson07_dt_threshold.png',
              'lesson07_particle_gold.png',
          )
          for name in pngs:
              p = Path('assets/reproduction-lab') / name
              if not p.exists() or p.stat().st_size < 10_000:
                  raise SystemExit(f'missing or suspiciously small plot: {name}')
              with Image.open(p) as im:
                  w, h = im.size
              if w < 900 or h < 500:
                  raise SystemExit(f'plot below evidence resolution contract: {name} {w}x{h}')

          print('LAB 07 REPRODUCIBLE EVIDENCE CONTRACT = PASS')
          PY
      - name: Commit only regenerated Lab 07 evidence
        run: |
          set -euo pipefail
          files=(
            assets/reproduction-lab/lesson07_last_pinned_profile.png
            assets/reproduction-lab/lesson07_bisection.png
            assets/reproduction-lab/lesson07_dt_threshold.png
            assets/reproduction-lab/lesson07_particle_gold.png
            assets/reproduction-lab/lesson07_threshold_search.txt
          )
          git diff --stat -- "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo 'Lab 07 evidence already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Regenerate Lab 07 localized scientific evidence'
          git push
