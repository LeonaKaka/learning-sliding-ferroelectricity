name: Regenerate Lab 07 plots

on:
  push:
    paths:
      - '.github/workflows/regenerate-lab07-plots.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CJK font and scientific Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Regenerate and verify Lab 07 scientific PNGs
        env:
          MPLBACKEND: Agg
        run: |
          python examples/reproduction-lab/lesson07_threshold_search.py | tee /tmp/lab07.out
          grep -F 'particle exact fc           = 1.000000000' /tmp/lab07.out
          grep -F 'particle dt=0.040 bracket   = [0.999984741, 1.000018311]' /tmp/lab07.out
          grep -F 'particle dt=0.020 bracket   = [0.999984741, 1.000018311]' /tmp/lab07.out
          grep -F 'particle dt=0.010 bracket   = [0.999984741, 1.000018311]' /tmp/lab07.out
          grep -F 'particle max |fc-1|         = 1.526e-06' /tmp/lab07.out
          grep -F 'line dt=0.100 bracket       = [0.777636719, 0.777783203]' /tmp/lab07.out
          grep -F 'line dt=0.050 bracket       = [0.777636719, 0.777783203]' /tmp/lab07.out
          grep -F 'line dt=0.025 bracket       = [0.777636719, 0.777783203]' /tmp/lab07.out
          grep -F 'line fc midpoint (dt=.05)   = 0.777709961' /tmp/lab07.out
          grep -F 'line dt-spread              = 0.000e+00' /tmp/lab07.out
          grep -F 'line final bracket width    = 1.465e-04' /tmp/lab07.out
          grep -F 'THRESHOLD GOLD TEST + SMALL-LINE BRACKET PASS' /tmp/lab07.out
      - name: Commit only regenerated Lab 07 PNGs
        run: |
          set -euo pipefail
          files=(
            assets/reproduction-lab/lesson07_last_pinned_profile.png
            assets/reproduction-lab/lesson07_bisection.png
            assets/reproduction-lab/lesson07_dt_threshold.png
            assets/reproduction-lab/lesson07_particle_gold.png
          )
          git diff -- "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo 'PNGs already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Regenerate Lab 07 localized scientific plots'
          git push
