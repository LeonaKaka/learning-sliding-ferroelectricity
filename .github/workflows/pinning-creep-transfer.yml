name: Finalize Pinning Creep lossless assets

on:
  push:
    branches: [pinning-creep-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch exact lossless figures and verify bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/pinning-creep
          curl -L --fail --retry 3 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-eeec-81fd-8d5b-9d8b9acc119c/raw?se=2026-08-31T05%3A54%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=163236ed-7a6c-4c8e-8cd2-48cb4c56e12d&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T18%3A54%3A52Z&ske=2026-08-31T18%3A54%3A52Z&sks=b&skv=2026-02-06&sig=87hvXgHgPKLIhTJpwNdcNOafet4OE8jUDRLGVSK34iQ%3D' -o assets/pinning-creep/tybell2002-fig3-creep.png
          curl -L --fail --retry 3 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-b9b0-81fd-bd7c-5a28d12f5b35/raw?se=2026-08-31T05%3A54%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=163236ed-7a6c-4c8e-8cd2-48cb4c56e12d&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T14%3A49%3A10Z&ske=2026-08-31T14%3A49%3A10Z&sks=b&skv=2026-02-06&sig=couNQgS9GKwGAYDWzx1XnzonQRx4bcF0kWfvY0hXlzk%3D' -o assets/pinning-creep/paruch2005-fig3-roughness.png
          curl -L --fail --retry 3 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-b818-81fd-aa42-3471ba3b566a/raw?se=2026-08-31T05%3A54%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=163236ed-7a6c-4c8e-8cd2-48cb4c56e12d&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T13%3A10%3A06Z&ske=2026-08-31T13%3A10%3A06Z&sks=b&skv=2026-02-06&sig=2Qgsogiw1B51SsiEF4CWWDfD3spkoCQ0ecmUSk0RkFQ%3D' -o assets/pinning-creep/kim2014-fig1-pinning.png
          cat > /tmp/pc.sha256 <<'EOF'
          b295f57c46c6a33c4ea25c10f311c8ab51c5bb76f05d94a00250c3f142799b3d  assets/pinning-creep/tybell2002-fig3-creep.png
          bb5f25a94169df219364072e084fd28cd204b7395973e0b369be127f3b38ce85  assets/pinning-creep/paruch2005-fig3-roughness.png
          dd8fabaa223dfbadbcd43ec110c9230602717011f5843d736ae1ec1ed2e38f4e  assets/pinning-creep/kim2014-fig1-pinning.png
          EOF
          sed -i 's/^          //' /tmp/pc.sha256
          sha256sum -c /tmp/pc.sha256
      - name: Commit clean lesson to staging branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pinning-creep-transfer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add lossless Pinning Creep lesson figures'
          git push origin HEAD:pinning-creep-build
