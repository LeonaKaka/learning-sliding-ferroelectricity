name: Correct Zhou source provenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-scaling-discipline-upgrade.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct source level
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('modules/depinning.html')
          s=p.read_text('utf-8')
          old='Phys. Rev. B 80, 134425 · APS official record / 项目 Drive PDF'
          new='Phys. Rev. B 80, 134425 · APS official record；项目 Drive 另存同组相关 RFIM overhang study（非该正式版 PDF）'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1),'utf-8')
          PY
          grep -q '非该正式版 PDF' modules/depinning.html
      - name: Commit provenance correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/depinning.html
          git commit -m 'Correct Zhou source provenance'
          git push