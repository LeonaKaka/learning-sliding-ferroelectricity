name: Apply finite-size collapse acceptance gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-collapse-gate-upgrade.yml'
      - '.github/patches/collapse_gate_20260901.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight
        run: |
          grep -q 'id="threshold-ladder"' modules/depinning.html
          grep -q 'ν / collapse' modules/research-track.html
      - name: Apply idempotent patch
        run: python .github/patches/collapse_gate_20260901.py
      - name: Verify collapse gate
        run: |
          grep -q 'id="collapse-gate"' modules/depinning.html
          grep -q 'id="collapse-gate-bridge"' modules/research-track.html
          grep -q 'C3 · predictive' modules/depinning.html
          grep -q 'held-out size' modules/depinning.html
          grep -q '两张图共享数据，就不是两次独立确认' modules/depinning.html
          python - <<'PY'
          from pathlib import Path
          for page in [Path('modules/depinning.html'), Path('modules/research-track.html')]:
              text=page.read_text('utf-8')
              bad=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ch not in '\n\r\t']
              assert not bad, (page,bad[:10])
          print('collapse gate HTML control-character scan passed')
          PY
      - name: Commit lesson
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/depinning.html modules/research-track.html
          git diff --cached --quiet && exit 0
          git commit -m 'Teach finite-size collapse acceptance gate'
          git push origin main
