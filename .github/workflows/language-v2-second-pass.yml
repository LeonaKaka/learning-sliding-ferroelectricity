name: Language V2 second pass

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/language_v2_second_pass.py'
      - 'scripts/language_v2_second_pass_fix.py'
      - '.github/workflows/language-v2-second-pass.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Apply safe visible-text pass
        run: python scripts/language_v2_second_pass_fix.py
      - name: Verify only expected pages changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]:-<none>}"
          for f in "${changed[@]}"; do
            case "$f" in
              modules/pinning-creep.html|modules/depinning.html|modules/disorder-rfim.html|modules/numerical-modeling.html|modules/research-track.html) ;;
              *) echo "Unexpected changed file: $f" >&2; exit 31 ;;
            esac
          done
      - name: Commit polished pages
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/pinning-creep.html modules/depinning.html modules/disorder-rfim.html modules/numerical-modeling.html modules/research-track.html
          git commit -m 'Polish Language V2 module prose'
          git push
