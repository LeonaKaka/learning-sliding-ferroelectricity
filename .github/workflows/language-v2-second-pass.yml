name: Language V2 second pass

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/language_v2_second_pass.py'
      - 'scripts/language_v2_second_pass_fix.py'
      - 'scripts/reproduction_lab_overview_nav_cleanup.py'
      - 'scripts/site_gap_teaching_seal.py'
      - 'scripts/concept_paths_seal.py'
      - 'scripts/claim_checks_seal.py'
      - 'scripts/module07_teaching_seal.py'
      - 'scripts/module08_teaching_seal.py'
      - 'scripts/reproduction_lab_overview_seal.py'
      - 'modules/foundations.html'
      - 'modules/research-track.html'
      - 'modules/concept-paths.html'
      - 'modules/pinning-creep.html'
      - 'modules/depinning.html'
      - 'modules/disorder-rfim.html'
      - 'modules/numerical-modeling.html'
      - 'modules/current-frontiers.html'
      - 'modules/reproduction-lab-overview.html'
      - 'site-nav.js'
      - 'index.html'
      - '.github/workflows/language-v2-second-pass.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Remove duplicate Lab overview nav runtime
        run: python scripts/reproduction_lab_overview_nav_cleanup.py
      - name: Apply safe visible-text pass
        run: python scripts/language_v2_second_pass_fix.py
      - name: Verify Teaching V2 site-gap read-only seal
        run: python scripts/site_gap_teaching_seal.py
      - name: Verify Concept Paths read-only seal
        run: python scripts/concept_paths_seal.py
      - name: Verify Teaching V2 claim-check seal
        run: python scripts/claim_checks_seal.py
      - name: Verify Module 07 Teaching V2 first-read seal
        run: python scripts/module07_teaching_seal.py
      - name: Verify Module 08 Teaching V2 evidence-frame seal
        run: python scripts/module08_teaching_seal.py
      - name: Verify Reproduction Lab overview seal
        run: python scripts/reproduction_lab_overview_seal.py
      - name: Verify only expected pages changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files:\n%s\n' "${changed[*]:-<none>}"
          for f in "${changed[@]}"; do
            case "$f" in
              modules/foundations.html|modules/switching-pathways.html|modules/domain-walls.html|modules/pinning-creep.html|modules/depinning.html|modules/disorder-rfim.html|modules/numerical-modeling.html|modules/current-frontiers.html|modules/research-track.html|modules/reproduction-lab.html|modules/reproduction-lab-*.html) ;;
              *) echo "Unexpected changed file: $f" >&2; exit 31 ;;
            esac
          done
      - name: Commit polished pages
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/foundations.html modules/switching-pathways.html modules/domain-walls.html modules/pinning-creep.html modules/depinning.html modules/disorder-rfim.html modules/numerical-modeling.html modules/current-frontiers.html modules/research-track.html modules/reproduction-lab.html modules/reproduction-lab-*.html
          git commit -m 'Polish Language V2 module prose'
          git push
