name: Recrop Reproduction Lab Lesson 06 Figure 5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recrop-lesson06-fig5.yml'

permissions:
  contents: write

jobs:
  crop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF/image dependencies
        run: python -m pip install --disable-pip-version-check pymupdf==1.26.7 pillow==12.3.0
      - name: Re-extract clean Figure 5 crop from verified paper
        run: |
          curl -L --retry 3 --fail -o /tmp/caballero2020.pdf https://arxiv.org/pdf/2006.15130
          python - <<'PY'
          import io, fitz
          from pathlib import Path
          from PIL import Image
          doc=fitz.open('/tmp/caballero2020.pdf')
          assert 'From bulk descriptions to emergent interfaces' in doc[0].get_text()
          page=doc[7]
          pix=page.get_pixmap(matrix=fitz.Matrix(450/72,450/72),alpha=False)
          im=Image.open(io.BytesIO(pix.tobytes('png')))
          w,h=im.size
          # Tight crop: Figure 5 + caption only; exclude right-column body text.
          box=(int(.055*w),int(.035*h),int(.505*w),int(.955*h))
          crop=im.crop(box)
          out=Path('assets/reproduction-lab/caballero2020-fig5-disordered-geometry.webp')
          crop.save(out,'WEBP',quality=92,method=6)
          assert 1650 < crop.width < 1800, crop.size
          assert crop.height > 4300, crop.size
          assert out.stat().st_size > 150_000
          print('clean Fig5 crop:', crop.size, 'bytes=', out.stat().st_size)
          PY
      - name: Commit cleaner paper crop
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/reproduction-lab/caballero2020-fig5-disordered-geometry.webp
          git commit -m 'Tighten Lesson 06 paper Figure 5 crop'
          git push
