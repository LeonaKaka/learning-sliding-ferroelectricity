name: Regenerate Lab 03 plot

# One-shot workflow: regenerate the project-owned scientific Figure from authoritative code.
on:
  push:
    paths:
      - '.github/workflows/regenerate-lab03-plot.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CJK font and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Regenerate scientific SVG from authoritative script
        env:
          MPLBACKEND: Agg
        run: |
          python examples/reproduction-lab/lesson03_ew_roughness.py | tee /tmp/lab03.out
          grep -F 't=  10.0: median rel err=0.91%  rms=1.36%  max=3.04%' /tmp/lab03.out
          grep -F 't= 100.0: median rel err=1.39%  rms=1.86%  max=3.40%' /tmp/lab03.out
          grep -F 't=1000.0: median rel err=1.02%  rms=1.33%  max=2.46%' /tmp/lab03.out
          grep -F 'late B/(Tr/c), r=2..10 = 0.9592' /tmp/lab03.out
          grep -F 'ALL THUMBNAIL GATES PASS' /tmp/lab03.out
      - name: Commit only regenerated Lab 03 SVG
        run: |
          set -euo pipefail
          git diff -- assets/reproduction-lab/lesson03_ew_roughness_thumbnail.svg
          if git diff --quiet -- assets/reproduction-lab/lesson03_ew_roughness_thumbnail.svg; then
            echo 'SVG already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/reproduction-lab/lesson03_ew_roughness_thumbnail.svg
          git commit -m 'Regenerate Lab 03 localized scientific plot'
          git push
