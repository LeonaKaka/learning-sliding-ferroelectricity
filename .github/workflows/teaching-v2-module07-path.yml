name: Teaching V2 Module 07 first-read path

on:
  push:
    paths:
      - 'scripts/teaching_v2_module07_path.py'
      - '.github/workflows/teaching-v2-module07-path.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Insert Module 07 first-read route
        run: python scripts/teaching_v2_module07_path.py
      - name: Verify only Module 07 changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = 'modules/numerical-modeling.html'
      - name: Commit Module 07 Teaching V2 path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/numerical-modeling.html
          git commit -m 'Add Module 07 first-read path'
          git push
