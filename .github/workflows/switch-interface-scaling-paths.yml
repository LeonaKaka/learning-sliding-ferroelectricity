name: Switch interface-scaling asset paths

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/switch-interface-scaling-paths.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch content references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('modules/numerical-modeling.html'),
              Path('modules/disorder-rfim.html'),
              Path('assets/numerical-modeling/README.md'),
              Path('assets/disorder-rfim/README.md'),
          ]
          changed = 0
          for p in files:
              s = p.read_text('utf-8')
              old = s.count('repaired-0607')
              if old:
                  s = s.replace('repaired-0607', 'interface-scaling')
                  p.write_text(s, 'utf-8')
                  changed += 1
                  print(f'{p}: replaced {old} old path reference(s)')
              assert 'repaired-0607' not in p.read_text('utf-8')
          assert changed == 4, changed
          assert '../assets/interface-scaling/caballero2020-fig1-bulk-to-interface.png' in Path('modules/numerical-modeling.html').read_text('utf-8')
          assert '../assets/interface-scaling/zhou2012-fig2-anomalous-roughness.png' in Path('modules/disorder-rfim.html').read_text('utf-8')
          for p in files:
              s=p.read_text('utf-8')
              assert not any(ord(ch)<32 and ch not in '\n\r\t' for ch in s)
          print('Content path migration validated.')
          PY
      - name: Verify new assets exist
        run: |
          test -f assets/interface-scaling/caballero2020-fig1-bulk-to-interface.png
          test -f assets/interface-scaling/caballero2020-fig5-roughness.png
          test -f assets/interface-scaling/caballero2020-fig5-structure-factor.png
          test -f assets/interface-scaling/zhou2012-fig2-anomalous-roughness.png
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/numerical-modeling.html modules/disorder-rfim.html assets/numerical-modeling/README.md assets/disorder-rfim/README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Point interface lessons to semantic asset directory'
          git push origin main
