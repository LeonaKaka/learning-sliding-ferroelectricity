name: Apply content upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-content-upgrade.yml'
      - 'scripts/content_upgrade_20260901.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source-level content upgrade
        run: python scripts/content_upgrade_20260901.py
      - name: Verify expected markers
        run: |
          grep -q 'Dai 2026：trilayer' modules/switching-pathways.html
          grep -q 'Dai 2026：什么时候单一 u(y)' modules/numerical-modeling.html
          grep -q '方法谱系 · 为什么后来不能只拟合一条 creep 直线' modules/pinning-creep.html
          grep -q 'Jeudy 2016：比“指数像不像”更强的测试' modules/depinning.html
          grep -q 'Baek boundary' modules/current-frontiers.html
      - name: Commit patched pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/switching-pathways.html modules/numerical-modeling.html modules/pinning-creep.html modules/depinning.html modules/current-frontiers.html
          git commit -m 'Add mechanism boundaries and method genealogy'
          git push
