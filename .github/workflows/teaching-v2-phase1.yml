name: Teaching V2 phase 1

on:
  push:
    paths:
      - 'scripts/teaching_v2_phase1.py'
      - '.github/workflows/teaching-v2-phase1.yml'

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Apply Teaching V2 phase 1
        run: python scripts/teaching_v2_phase1.py
      - name: Verify only 04-06 changed
        run: |
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -vE '^(modules/(pinning-creep|depinning|disorder-rfim)\.html)?$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected changed files:"
            echo "$bad"
            exit 1
          fi
          test -n "$changed"
      - name: Commit Teaching V2 pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/pinning-creep.html modules/depinning.html modules/disorder-rfim.html
          git commit -m 'Improve Teaching V2 flow for modules 04-06'
          git push
