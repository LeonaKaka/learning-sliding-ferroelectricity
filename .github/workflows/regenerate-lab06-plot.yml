name: Regenerate Lab 06 plot

on:
  push:
    paths:
      - '.github/workflows/regenerate-lab06-plot.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CJK font and scientific Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check numpy matplotlib scipy
      - name: Regenerate and verify Lab 06 scientific SVG
        env:
          MPLBACKEND: Agg
        run: |
          python examples/reproduction-lab/lesson06_disordered_geometry.py | tee /tmp/lab06.out
          grep -F 'B median rel, r=4..32  = 1.227%' /tmp/lab06.out
          grep -F 'S log-bin median rel   = 6.122%' /tmp/lab06.out
          grep -F 'zeta_B GL / EW         = 0.538906 / 0.509213' /tmp/lab06.out
          grep -F 'zeta_S GL / EW         = 0.694308 / 0.664796' /tmp/lab06.out
          grep -F 'GL fitted A, w         = 0.982981, 1.371256' /tmp/lab06.out
          grep -F 'GL profile-fit RMSE    = 0.077925' /tmp/lab06.out
          grep -F 'CROSS-MODEL GEOMETRY PASS; ASYMPTOTIC ZETA GATE NOT PASSED' /tmp/lab06.out
      - name: Commit only the regenerated Lab 06 SVG
        run: |
          set -euo pipefail
          git diff -- assets/reproduction-lab/lesson06_disordered_geometry_checkpoint.svg
          if git diff --quiet -- assets/reproduction-lab/lesson06_disordered_geometry_checkpoint.svg; then
            echo 'SVG already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/reproduction-lab/lesson06_disordered_geometry_checkpoint.svg
          git commit -m 'Regenerate Lab 06 localized scientific plot'
          git push
