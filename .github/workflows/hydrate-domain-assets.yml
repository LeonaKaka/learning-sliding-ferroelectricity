name: One-time freeze Domain Walls assets

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hydrate-domain-assets.yml

permissions:
  contents: write
  actions: read

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified assets from last successful Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/pages-artifact /tmp/pages-site
          mkdir -p /tmp/pages-artifact /tmp/pages-site assets/domain-walls
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9731551156/zip > /tmp/pages-artifact/pages.zip
          unzip -q /tmp/pages-artifact/pages.zip -d /tmp/pages-artifact
          tar -xf /tmp/pages-artifact/artifact.tar -C /tmp/pages-site
          cp /tmp/pages-site/assets/domain-walls/*.webp assets/domain-walls/
          test "$(find assets/domain-walls -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 9
          for f in assets/domain-walls/*.webp; do
            test "$(stat -c%s "$f")" -ge 20000
            file "$f" | grep -q 'Web/P image'
            echo "$f $(stat -c%s "$f")"
          done

      - name: Commit static assets
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/domain-walls
          git diff --cached --quiet && exit 0
          git commit -m 'Freeze verified Domain Walls assets'
          git push origin HEAD:main
