name: Stage lossless Depinning figures
on:
  push:
    branches: [stage-depinning-05]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-depinning-05
      - name: Download exact frozen PNG bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/depinning
          curl -fL --retry 3 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-748c-81fd-884e-072e722cfdc0/raw?se=2026-08-31T06%3A06%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=2afc9e58-0a1c-4705-85fb-9eb5bab3eee3&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T18%3A41%3A37Z&ske=2026-08-31T18%3A41%3A37Z&sks=b&skv=2026-02-06&sig=e6NE7/JBSY71b0Fc1%2BGHHi8tLJJFz5jU36t76LGrzlY%3D' -o assets/depinning/chauve2000-fig1-force-velocity.png
          curl -fL --retry 3 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-db14-81fd-8699-a97e7cb8d0ec/raw?se=2026-08-31T06%3A06%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=2afc9e58-0a1c-4705-85fb-9eb5bab3eee3&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T18%3A51%3A14Z&ske=2026-08-31T18%3A51%3A14Z&sks=b&skv=2026-02-06&sig=au/ntQuh6XRPq72qB9mPMQ5msUEOgdon6YfSn49RBK0%3D' -o assets/depinning/rosso2003-fig2-critical-roughness.png
          curl -fL --retry 3 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-8cbc-81fd-ba47-40f6bae83797/raw?se=2026-08-31T06%3A06%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=2afc9e58-0a1c-4705-85fb-9eb5bab3eee3&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T18%3A47%3A23Z&ske=2026-08-31T18%3A47%3A23Z&sks=b&skv=2026-02-06&sig=osdHnqxnp4ZWxGyJW6MQSC0KAuKQPMmzg/fBiAa/4bs%3D' -o assets/depinning/ferrero2013-fig3-nonsteady-velocity.png
          curl -fL --retry 3 'https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-0894-81fd-af4e-28b7079e6e8b/raw?se=2026-08-31T06%3A06%3A59Z&sp=r&sv=2026-02-06&sr=b&scid=2afc9e58-0a1c-4705-85fb-9eb5bab3eee3&skoid=5e713cdb-766b-475e-a3ca-8adb6cf99aa0&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-30T18%3A49%3A18Z&ske=2026-08-31T18%3A49%3A18Z&sks=b&skv=2026-02-06&sig=FZ2%2BLZf0hOqgRyLj4qPucBo6rSmLjjV6lpvfCAd/rlU%3D' -o assets/depinning/wiese2022-fig22-depinning-phenomenology.png
          echo '71357b4ec7a40c50b54bb0d6e18c2719f3563f522f1b100611193c71c539d0cc  assets/depinning/chauve2000-fig1-force-velocity.png' > /tmp/checksums
          echo '336a7b59990c1f31d8c3f74534888d467b52c7fd6a6c4ccf870d3bb4bd1b6c59  assets/depinning/rosso2003-fig2-critical-roughness.png' >> /tmp/checksums
          echo 'e9d2c5fd897ac44b5212d34db1322e93eb887310db970b7417f1831885e7ac14  assets/depinning/ferrero2013-fig3-nonsteady-velocity.png' >> /tmp/checksums
          echo '0d935ee5cdc20b170d2e17f6d407fdb239d2f66c7700a1d1e3bf19cb8dc0cc13  assets/depinning/wiese2022-fig22-depinning-phenomenology.png' >> /tmp/checksums
          sha256sum -c /tmp/checksums
      - name: Commit frozen assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/depinning/*.png
          if ! git diff --cached --quiet; then
            git commit -m 'Add lossless Depinning lesson figures'
            git push origin HEAD:stage-depinning-05
          fi
