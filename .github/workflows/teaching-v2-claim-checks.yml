name: Teaching V2 claim checks

on:
  push:
    paths:
      - 'scripts/teaching_v2_claim_checks.py'
      - '.github/workflows/teaching-v2-claim-checks.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Insert claim-boundary self-tests
        run: python scripts/teaching_v2_claim_checks.py
      - name: Verify only modules 04-06 changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -vE '^(modules/(pinning-creep|depinning|disorder-rfim)\.html)?$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected changed files:"
            echo "$bad"
            exit 1
          fi
          test -n "$changed"
      - name: Commit claim checks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modules/pinning-creep.html modules/depinning.html modules/disorder-rfim.html
          git commit -m 'Add Teaching V2 claim checks'
          git push
