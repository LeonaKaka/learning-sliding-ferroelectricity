name: Regenerate Lab 09 plots

on:
  push:
    paths:
      - '.github/workflows/regenerate-lab09-plots.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CJK font and scientific Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check numpy numba matplotlib pillow
      - name: Regenerate and verify Lab 09 beta evidence
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          cp assets/reproduction-lab/lesson09_beta_window.txt /tmp/lab09_before.txt
          cp assets/reproduction-lab/lesson09_beta_window.csv /tmp/lab09_before.csv
          python examples/reproduction-lab/lesson09_beta_window.py | tee /tmp/lab09.out
          python - <<'PY'
          from pathlib import Path
          import csv, re
          import numpy as np
          from PIL import Image

          receipt = Path('assets/reproduction-lab/lesson09_beta_window.txt').read_text(encoding='utf-8')
          stdout = Path('/tmp/lab09.out').read_text(encoding='utf-8')
          before = Path('/tmp/lab09_before.txt').read_text(encoding='utf-8')

          for marker in (
              'UNIVERSAL BETA CLAIM          = NOT AUTHORIZED',
              'WINDOW-STABILITY GATE         = NOT PASSED',
          ):
              if marker not in receipt or marker not in stdout:
                  raise SystemExit(f'Lab 09 decision boundary changed: {marker}')

          protocol = (
              'independent disorder n       = 8',
              'statistical unit             = disorder realization (not df points)',
              'seeds                        = 20260902..20260909',
              'line L, M, du, rf            = 32, 256, 0.250, 1.000',
              'threshold dt                 = 0.0500',
              'velocity dt                  = 0.0250',
              'steady protocol              = discard 1 u-period; measure next 3 periods',
              'delta-f ladder                = 0.015, 0.025, 0.040, 0.065, 0.105, 0.170',
              'window drift gate            = < 0.030',
          )
          for token in protocol:
              if token not in receipt:
                  raise SystemExit(f'Lab 09 protocol drifted: {token}')

          displayed = (
              'max df=0.170 beta             = 0.267993',
              'max df=0.105 beta             = 0.229890',
              'max df=0.065 beta             = 0.195041',
              'max df=0.040 beta             = 0.165810',
              'window beta drift            = 0.102183',
              'threshold-edge beta span     = 0.001004',
          )
          for token in displayed:
              if token not in receipt:
                  raise SystemExit(f'Lab 09 page-visible result drifted: {token}')

          def number(pattern, text=receipt):
              m=re.search(pattern,text)
              if not m: raise SystemExit(f'missing receipt field: {pattern}')
              return float(m.group(1))

          particle_err=number(r'particle max \|beta-0\.5\|\s+= ([0-9.]+)')
          max_bracket=number(r'max threshold bracket width\s+= ([0-9.]+)')
          drift=number(r'window beta drift\s+= ([0-9.]+)')
          edge_span=number(r'threshold-edge beta span\s+= ([0-9.]+)')
          if not (particle_err < 0.005 and max_bracket < 2e-4 and drift > 0.030 and edge_span < 0.005):
              raise SystemExit('Lab 09 numerical decision gates no longer hold')

          bm=re.search(r'sample bootstrap 95% CI\s+= \[([0-9.]+), ([0-9.]+)\]',receipt)
          if not bm: raise SystemExit('bootstrap CI missing')
          ci_lo,ci_hi=map(float,bm.groups())
          if not (ci_lo < ci_hi and 0.20 < ci_lo < 0.35 and 0.20 < ci_hi < 0.35):
              raise SystemExit('bootstrap CI malformed or materially drifted')

          def load_csv(path):
              with open(path,newline='',encoding='utf-8') as f:
                  rows=list(csv.DictReader(f))
              return rows
          old=load_csv('/tmp/lab09_before.csv'); new=load_csv('assets/reproduction-lab/lesson09_beta_window.csv')
          if len(old)!=8 or len(new)!=8:
              raise SystemExit('Lab 09 CSV must contain 8 independent disorder rows')
          if [r['seed'] for r in old] != [r['seed'] for r in new]:
              raise SystemExit('Lab 09 seed identities changed')
          for ro,rn in zip(old,new):
              for key in rn:
                  if key=='seed': continue
                  if abs(float(ro[key])-float(rn[key])) > 2e-6:
                      raise SystemExit(f'Lab 09 CSV result drifted: seed={rn["seed"]} {key} {ro[key]} -> {rn[key]}')

          old_beta=re.findall(r'max df=([0-9.]+) beta\s+= ([0-9.]+)',before)
          new_beta=re.findall(r'max df=([0-9.]+) beta\s+= ([0-9.]+)',receipt)
          if old_beta != new_beta:
              raise SystemExit(f'Lab 09 fitted beta table changed: {old_beta} -> {new_beta}')

          for name in ('lesson09_mean_v_loglog.png','lesson09_beta_vs_window.png','lesson09_threshold_sensitivity.png','lesson09_bootstrap_beta.png'):
              p=Path('assets/reproduction-lab')/name
              if not p.exists() or p.stat().st_size < 10_000:
                  raise SystemExit(f'missing or suspiciously small plot: {name}')
              with Image.open(p) as im:
                  w,h=im.size
              if w < 900 or h < 500:
                  raise SystemExit(f'plot below evidence resolution contract: {name} {w}x{h}')

          print('LAB 09 BETA WINDOW FAILURE BOUNDARY REPRODUCED = PASS')
          PY
      - name: Commit only regenerated Lab 09 evidence
        run: |
          set -euo pipefail
          files=(
            assets/reproduction-lab/lesson09_mean_v_loglog.png
            assets/reproduction-lab/lesson09_beta_vs_window.png
            assets/reproduction-lab/lesson09_threshold_sensitivity.png
            assets/reproduction-lab/lesson09_bootstrap_beta.png
            assets/reproduction-lab/lesson09_beta_window.txt
            assets/reproduction-lab/lesson09_beta_window.csv
          )
          git diff --stat -- "${files[@]}"
          if git diff --quiet -- "${files[@]}"; then
            echo 'Lab 09 evidence already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Regenerate Lab 09 localized scientific evidence'
          git push
