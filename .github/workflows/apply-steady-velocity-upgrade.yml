name: Apply steady-velocity measurement upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-steady-velocity-upgrade.yml'
      - '.github/patches/steady_velocity_20260901.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight
        run: |
          grep -q 'id="wall-extraction"' modules/numerical-modeling.html
          grep -q '<div id="moduleList"></div>' index.html
          grep -q 'unique_contracts = {' .github/workflows/pages.yml
      - name: Apply idempotent patch
        run: python .github/patches/steady_velocity_20260901.py
      - name: Verify steady-velocity contract
        run: |
          grep -q 'id="velocity-estimator"' modules/numerical-modeling.html
          grep -q 'X(t) = ⟨u(y,t)⟩<sub>y</sub>' modules/numerical-modeling.html
          grep -q 'ordinary least-squares pointwise error 不是 disorder uncertainty' modules/numerical-modeling.html
          grep -q 'resolved-pinned under registered exposure' modules/numerical-modeling.html
          grep -q 'id="foundations"' index.html
          grep -q "if(m.id!=='foundations')el.id=m.id" index.html
          python - <<'PY'
          from pathlib import Path
          for page in [Path('index.html'), Path('modules/numerical-modeling.html')]:
              text=page.read_text('utf-8')
              bad=[(i,ord(ch)) for i,ch in enumerate(text) if ord(ch)<32 and ch not in '\n\r\t']
              assert not bad, (page,bad[:10])
          print('HTML control-character scan passed')
          PY
      - name: Commit lesson
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/numerical-modeling.html index.html .github/workflows/pages.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Teach steady wall velocity measurement contract'
          git push origin main
