name: Apply thermal-noise discretization upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-thermal-noise-upgrade.yml'
      - '.github/patches/thermal_noise_20260901.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight
        run: |
          grep -q 'id="grid"' modules/numerical-modeling.html
          grep -q 'id="wall-extraction"' modules/numerical-modeling.html
          grep -q 'id="temperature"' modules/research-track.html
      - name: Apply idempotent patch
        run: python .github/patches/thermal_noise_20260901.py
      - name: Verify thermal-noise contract
        run: |
          test "$(grep -o 'id="thermal-noise"' modules/numerical-modeling.html | wc -l | tr -d ' ')" = "1"
          grep -q '2Γ k<sub>B</sub>T / (ΔV Δt)' modules/numerical-modeling.html
          grep -q '2Γ k<sub>B</sub>T Δt / ΔV' modules/numerical-modeling.html
          grep -q 'Δt<sup>−1/2</sup>' modules/numerical-modeling.html
          grep -q 'Δt<sup>+1/2</sup>' modules/numerical-modeling.html
          grep -q 'thermal seed 仍然只是 inner repeat' modules/numerical-modeling.html
          grep -q 'numerical-modeling.html#thermal-noise' modules/research-track.html
          python - <<'PY'
          from pathlib import Path
          for page in (Path('modules/numerical-modeling.html'), Path('modules/research-track.html')):
              s = page.read_text('utf-8')
              bad = [(i, ord(ch)) for i, ch in enumerate(s) if ord(ch) < 32 and ch not in '\n\r\t']
              assert not bad, (page, bad[:10])
          PY
      - name: Commit thermal-noise lesson
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add modules/numerical-modeling.html modules/research-track.html
            git commit -m 'Teach thermal-noise FDT discretization'
            git push
          fi
