name: Apply data-to-claim contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-data-claim-contract.yml'
      - '.github/patches/data_claim_contract_20260901.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preflight anchors
        run: |
          grep -q 'id="event-contract"' modules/research-track.html
          grep -q '<h2>5 · Mechanism falsification' modules/research-track.html
          grep -q '<h2>把它变成一个靠谱的数值实验</h2>' modules/depinning.html
          grep -q 'observable anatomy → mechanism falsification' index.html || grep -q 'data-to-claim contract' index.html
      - name: Apply idempotent patch
        run: python .github/patches/data_claim_contract_20260901.py
      - name: Verify content contract
        run: |
          test "$(grep -o 'id="data-claim-contract"' modules/research-track.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="data-claim-bridge"' modules/depinning.html | wc -l | tr -d ' ')" = "1"
          grep -q 'right-censored / exposure-limited' modules/research-track.html
          grep -q 'numerical invalid ≠ physical pinned' modules/research-track.html
          grep -q 'bootstrap draws' modules/research-track.html
          grep -q 'authority chain' modules/research-track.html
          grep -q 'E4 · universality / breakdown' modules/research-track.html
          grep -q 'data-to-claim contract' index.html
      - name: Commit content upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add modules/research-track.html modules/depinning.html index.html
            git commit -m 'Teach data-to-claim evidence contract'
            git push
          fi
