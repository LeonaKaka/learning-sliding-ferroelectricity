name: Apply disorder bridge upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-disorder-bridge.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          python -m pip install --quiet pillow
      - name: Apply source patch and recover original figure
        run: python scripts/disorder_bridge_upgrade_20260901.py
      - name: Verify expected content
        run: |
          test -s assets/disorder-rfim/paul2026-fig4-multidomain-disorder.webp
          grep -q 'Research bridge · 真实 sliding-FE 里的 disorder' modules/disorder-rfim.html
          grep -q 'disorder 至少有三条独立轴' modules/numerical-modeling.html
          grep -q 'Baek et al. 2026' curriculum.js
          grep -q 'Dai et al. 2026' curriculum.js
      - name: Commit upgraded teaching content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/disorder-rfim/paul2026-fig4-multidomain-disorder.webp modules/disorder-rfim.html modules/numerical-modeling.html curriculum.js
          git commit -m 'Bridge real sliding-FE disorder to effective models'
          git push
