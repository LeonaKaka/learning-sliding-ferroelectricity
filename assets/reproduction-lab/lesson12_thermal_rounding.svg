490" x2="455" y2="490"/><polyline class="a" points="55.0,490.0 135.0,434.1 215.0,401.4 295.0,378.9 455.0,355.0"/><text class="small" x="55" y="515">f = fc_lo - 0.08 · direct finite-time Langevin</text><rect class="box" x="535" y="320" width="480" height="215" rx="8"/><text class="ttl" x="555" y="345">4 · But low-T creep is unresolved</text><line class="ax" x1="555" y1="490" x2="955" y2="490"/><polyline class="a" points="555.0,414.1 635.0,363.4 715.0,355.0 795.0,355.0 955.0,355.0"/><text class="big" x="585" y="415">T=.02 resolved = 56.2%</text><text class="small" x="555" y="515">Low-T half-window velocity instability is large → no creep μ claim.</text></svg>