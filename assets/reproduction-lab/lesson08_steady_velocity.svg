<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="590" viewBox="0 0 1050 590" role="img" aria-label="Lesson 08 steady velocity validation"><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#20211f}.box{fill:#fffdf8;stroke:#d8d1c3}.ax{stroke:#444;stroke-width:1}.a{fill:none;stroke:#222;stroke-width:2}.b{fill:none;stroke:#666;stroke-width:1.5;stroke-dasharray:6 4}.c{fill:none;stroke:#999;stroke-width:1.5}.ttl{font-size:18px;font-weight:650}.small{font-size:12px;fill:#716d66}</style><rect width="1050" height="590" fill="#fff"/><text x="525" y="28" text-anchor="middle" font-size="22">Reproduction Lab · Lesson 08 · steady velocity before beta</text><rect class="box" x="35" y="45" width="450" height="225" rx="8"/><text class="ttl" x="55" y="68">1 · Analytic velocity gold test</text><line class="ax" x1="55" y1="230" x2="455" y2="230"/><line class="ax" x1="55" y1="75" x2="55" y2="230"/><polyline class="a" points="63.5,218.6 106.1,196.0 191.2,162.6 446.5,88.4"/><polyline class="b" points="63.5,218.6 106.1,196.0 191.2,162.6 446.5,88.4"/><text class="small" x="55" y="252">v̄ = √(f²−1); numerical max rel error 0.0014%</text><rect class="box" x="535" y="45" width="480" height="225" rx="8"/><text class="ttl" x="555" y="68">2 · First disorder period is transient</text><line class="ax" x1="555" y1="230" x2="955" y2="230"/><line class="ax" x1="555" y1="75" x2="555" y2="230"/><polyline class="a" opacity="0.72" points="555.0,205.0 688.3,198.9 821.7,198.9 955.0,198.9"/><polyline class="a" opacity="0.72" points="555.0,188.4 688.3,180.2 821.7,180.2 955.0,180.2"/><polyline class="a" opacity="0.72" points="555.0,160.3 688.3,149.2 821.7,149.2 955.0,149.2"/><polyline class="a" opacity="0.72" points="555.0,102.9 688.3,91.0 821.7,91.0 955.0,91.0"/><line class="b" x1="688" y1="75" x2="688" y2="230"/><text class="small" x="555" y="252">period 1 discarded; transient shift 3.5–4.9%</text><rect class="box" x="35" y="315" width="450" height="225" rx="8"/><text class="ttl" x=