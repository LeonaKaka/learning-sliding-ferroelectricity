<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="590" viewBox="0 0 1050 590" role="img" aria-label="Lesson 09 beta critical-window validation"><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#20211f}.box{fill:#fffdf8;stroke:#d8d1c3}.ax{stroke:#444;stroke-width:1}.a{fill:none;stroke:#222;stroke-width:2}.b{fill:none;stroke:#777;stroke-width:1.5;stroke-dasharray:6 4}.ttl{font-size:18px;font-weight:650}.s{font-size:12px;fill:#716d66}</style><rect width="1050" height="590" fill="#fff"/><text x="525" y="28" text-anchor="middle" font-size="22">Reproduction Lab · Lesson 09 · beta needs a stable critical window</text>
<rect class="box" x="35" y="45" width="450" height="225" rx="8"/><text class="ttl" x="55" y="68">1 · Regression gold test: beta = 1/2</text><line class="ax" x1="55" y1="220" x2="455" y2="220"/><line class="ax" x1="55" y1="75" x2="55" y2="220"/><polyline class="a" points="435.0,114.0 195.0,138.9 75.0,154.4"/><line class="b" x1="55" y1="183.8" x2="455" y2="183.8"/><text class="s" x="55" y="245">tilted washboard: max |beta−0.5| = 0.0039</text>
<rect class="box" x="535" y="45" width="480" height="225" rx="8"/><text class="ttl" x="555" y="68">2 · Eight independent disorder samples</text><line class="ax" x1="555" y1="220" x2="955" y2="220"/><line class="ax" x1="555" y1="75" x2="555" y2="220"/><polyline class="a" points="555.0,204.8 580.8,195.8 619.5,182.6 684.0,163.4 787.3,133.7 955.0,88.8"/><text class="s" x="555" y="245">arithmetic disorder mean v(Δf); each sample uses its own fc bracket</text>
<rect class="box" x="35" y="320" width="450" height="225" rx="8"/><text class="ttl" x="55" y="343">3 · Critical-window stability gate</text><line class="ax" x1="55" y1="495" x2="455" y2="495"/><line class="ax" x1="55" y1="350" x2="55" y2="495"/><polyline class="a" points="55.0,477.4 131.9,444.8 255.0,405.9 455.0,363.4"/><text class="s" x="55" y="520">max Δf: .170 → .105 → .065 → .040; drift = 0.102 &gt; 0.030 gate</text>
<rect class="box" x="535" y="320" width="480" height="225" rx="8"/><text class="ttl" x="555" y="343">4 · Precision is not the same as asymptotics</text><line x1="740" y1="408" x2="780" y2="408" stroke="#333" stroke-width="3"/><line x1="760" y1="380" x2="760" y2="436" stroke="#333" stroke-width="3"/><text x="800" y="414" font-size="17">all-six beta = 0.268</text><text class="s" x="555" y="470">sample bootstrap 95% CI = [0.247, 0.290]</text><text class="s" x="555" y="495">threshold-edge beta span = 0.0010</text><text class="s" x="555" y="520">window drift dominates → universal beta NOT claimed</text></svg>